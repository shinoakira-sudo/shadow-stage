    let run=0; d[0]=1; for(let lag=1;lag<=maxLag;lag++){ let s=0; for(let i=0;i<frame;i+=3){ const x=pcm[st+i]-pcm[st+i+lag]; s+=x*x; } run+=s; d[lag]=s*lag/(run||1); }
    for(let lag=minLag;lag<=maxLag;lag++){ if(d[lag]<0.15){ while(lag+1<=maxLag && d[lag+1]<d[lag]) lag++; out.push(sr/lag); break; } } }
  return out; }
function analyzeTake(pcm, sr, part){
  const F=Math.round(sr*0.02), N=Math.floor(pcm.length/F); if(N<10) return null; const db=new Float32Array(N);

  const speechSec=(last-first+1)*0.02; const vdb=[]; for(let i=first;i<=last;i++) if(vo[i]) vdb.push(db[i]); vdb.sort((a,b)=>a-b);

    pauses:gaps.filter(g=>g<1.5).length, longPauses:gaps.filter(g=>g>=1.5).length, levelDb:Math.round(vdb[Math.floor(vdb.length/2)]*10)/10,
    pitchRange: pr==null?null:Math.round(pr*10)/10 };
}

// ===== 評価に送る本文：文ごとの文節（ルビは ｜漢字《よみ》）。段落の番号も持っておき、カードを同じ形で描く =====
function evalText(part){ const model=listenModel(part); const pis=model.all.filter(s=>!s.chap).map(s=>s.pi);
  const sents=model.sents.map(sm=>sm.chunks.map(([a,b])=>sm.units.slice(a,b).map(u=>u.rt?`｜${u.d}《${u.rt}》`:u.d).join('')));
  const marks=(plain(part.paras.join('')).match(/[、。！？]/g)||[]).length;
  return {sents, pis, marks}; }
// 本文の読み（ひらがな）は、おはなしごとにこの端末へ覚えておき、2回めからは送る（同じ基準でくらべられる）
const YKEY='yomista.yomi';
const hashStr = s => { let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); };
function yomiGet(partId, sents){ try{ const m=JSON.parse(localStorage.getItem(YKEY)||'{}'); const e=m[partId]; if(e && e.h===hashStr(JSON.stringify(sents)) && Array.isArray(e.y)) return e.y; }catch(e){} return null; }
function yomiPut(partId, sents, y){ try{ const m=JSON.parse(localStorage.getItem(YKEY)||'{}'); m[partId]={h:hashStr(JSON.stringify(sents)), y, at:Date.now()};
  const ks=Object.keys(m); if(ks.length>60) ks.sort((a,b)=>m[a].at-m[b].at).slice(0,ks.length-60).forEach(k=>delete m[k]); localStorage.setItem(YKEY, JSON.stringify(m)); }catch(e){} }
async function assessRemote(pcm, sr, an, et, grade, partId){
  const s0=Math.max(0,Math.floor((an.first-0.25)*sr)), s1=Math.min(pcm.length, Math.ceil((an.last+0.4)*sr), s0+300*sr);
  const yomi=yomiGet(partId, et.sents);
  const body=JSON.stringify({audio:pcmToWavBase64(normalizeLevel(pcm.subarray(s0,s1)),sr), mimeType:'audio/wav', sents:et.sents, grade, ...(yomi?{yomi}:{}),
    metrics:{speechSec:an.speechSec, cpm:an.cpm, pauses:an.pauses, longPauses:an.longPauses, marks:et.marks, levelDb:an.levelDb, pitchRange:an.pitchRange}});
  const hd={'Content-Type':'application/json','Authorization':'Bearer '+SB_ANON,'apikey':SB_ANON}; const pw=passGet(); if(pw) hd['x-yomista-pass']=pw;
  const call=()=>fetch(SB_URL+'/functions/v1/yomista-assess',{method:'POST',headers:hd,body});
  let r; try{ r=await call(); }catch(e){ await sleepMs(1500); r=await call(); }
  if(r.status===503||r.status===546||r.status===504){ await sleepMs(1500); r=await call(); }
  const g=await r.json().catch(()=>({error:'HTTP '+r.status}));
  if(r.status===401 && g.code==='pass'){ const e=new Error(pw?'合言葉がちがいます':'合言葉が入っていません'); e.pass=true; throw e; }
  if(!r.ok||g.error) throw new Error((g.error||('HTTP '+r.status))+(g.detail?'：'+String(g.detail).slice(0,80):''));
  const ym=g.meta&&g.meta.yomi&&g.meta.yomi.model; if(!yomi && Array.isArray(g.yomi) && ym && ym!=='rough' && ym!=='client') yomiPut(partId, et.sents, g.yomi);
  return Object.assign(g, {cut:(an.last-an.first)>300});
}

// ===== 点数：AIの先生の採点 ＋ その場で測った値 =====
const GRADE_BAND={1:[150,250],2:[170,270],3:[200,300],4:[220,320],5:[240,340],6:[250,350]};
const gradeNow = () => Math.min(6,Math.max(1,Math.round(+S.settings.grade||3)));
const W8={acc:.35, smooth:.2, clear:.15, pause:.15, speed:.05, feeling:.1};
function speedScore(v, g){ const [lo,hi]=GRADE_BAND[g]||GRADE_BAND[3]; const d=v<lo?lo-v:v>hi?v-hi:0; return Math.max(30,Math.round(100-d*0.8)); }
const markOf = v => v==null ? '―' : v>=80 ? '◎' : v>=60 ? '○' : '△';
const markCls = v => v==null ? 'm0' : v>=80 ? 'm3' : v>=60 ? 'm2' : 'm1';
const rankOf = v => v>=90?'音読名人！':v>=80?'じょうず！':v>=65?'いいね！':v>=50?'もうすこし！':'れんしゅうしよう';
function localItems(an, et){   // AIにとどかないときの代わり（機械で測った値だけ）
  const clear=an.levelDb>=-26?85:an.levelDb>=-32?70:an.levelDb>=-38?55:40;
  const r=et.marks?an.pauses/et.marks:1; const pause=Math.max(30,Math.min(95,Math.round(95-Math.abs(1-r)*60)));
  const smooth=Math.max(30,95-an.longPauses*10);
  return {clear, pause, smooth}; }
function readFracOf(et, marks){ const miss=new Set((marks||[]).filter(m=>m.st==='missing').map(m=>m.s+':'+m.c)); let tot=0, gone=0;
  et.sents.forEach((row,s)=>row.forEach((c,k)=>{ const n=plain(c).replace(/[\s、。！？「」『』（）・…―ー\-—,.!?]/g,'').length; tot+=n; if(miss.has(s+':'+k)) gone+=n; })); return tot?(tot-gone)/tot:1; }
function buildResult(part, et, an, g, grade, err){
  const frac = !g || g.speech===false ? 1 : (typeof g.readFrac==='number' ? g.readFrac : readFracOf(et, g.marks));   // とばした分の字は、速さに数えない
  const cpmR = Math.round(an.cpm*Math.max(0.05,frac));
  const sp=speedScore(cpmR, grade); let items;
  if(g && g.speech===false) items={acc:0, smooth:0, clear:0, pause:0, speed:null, feeling:0};
  else if(g && g.judged!==false) items={acc:g.coverage, smooth:g.smooth, clear:g.clear, pause:g.pause, speed:sp, feeling:g.feeling};
  else if(g){ const L=localItems(an,et); items={acc:g.coverage, smooth:Math.min(L.smooth, g.coverage+15), clear:L.clear, pause:L.pause, speed:sp, feeling:null}; }
  else { const L=localItems(an,et); items={acc:null, smooth:L.smooth, clear:L.clear, pause:L.pause, speed:sp, feeling:null}; }
  let a=0, w=0; for(const k in W8){ if(items[k]!=null){ a+=W8[k]*items[k]; w+=W8[k]; } } const score = (g&&g.speech===false) ? 0 : Math.round(w?a/w:0);
  return {v:1, part:part.id, at:Date.now(), date:todayKey(), grade, score, items, cpm:cpmR, speechSec:an.speechSec, levelDb:an.levelDb, pitchRange:an.pitchRange,
    sents:et.sents, pis:et.pis, marks:(g&&g.marks)||[], counts:(g&&g.counts)||null, good:(g&&g.good)||'', tips:(g&&g.tips)||[], parent:(g&&g.parent)||'', transcript:(g&&g.transcript)||'',
    speech:g?g.speech!==false:true, ai:!!g, judged:!!(g&&g.judged!==false&&g.speech!==false), cut:!!(g&&g.cut), err:err||'',
    model:g&&g.meta?[g.meta.asr&&g.meta.asr.model, g.meta.judge&&g.meta.judge.model].filter(Boolean).join(' + '):'' };
}
function demoResult(part){ const et=evalText(part); const flat=[], marks=[];
  et.sents.forEach((row,s)=>row.forEach((c,k)=>{ if(plain(c).replace(/[、。！？「」『』（）\s]/g,'').length>=3) flat.push({s,c:k}); }));
  if(flat.length>6){ marks.push({...flat[Math.floor(flat.length*0.35)], st:'missing', heard:''}); marks.push({...flat[Math.floor(flat.length*0.7)], st:'unclear', heard:''}); }
  return {v:1, demo:true, part:part.id, at:Date.now(), date:todayKey(), grade:gradeNow(), score:84, items:{acc:92, smooth:80, clear:86, pause:68, speed:100, feeling:72},
    cpm:248, speechSec:Math.round(part.chars/248*600)/10, sents:et.sents, pis:et.pis, marks, counts:{total:flat.length, ok:flat.length-2, unclear:1, wrong:0, missing:1, extra:0},
    good:'大きな声で、さいごまで しっかり よめたね！', tips:['「。」のあとは、ひと休みしてから つぎの文へ。','会話の「」は、その人になったつもりで よもう。'],
    parent:'', transcript:'', speech:true, ai:true, judged:true, model:''}; }

// ===== 保存：点数の要約はプレイヤーの記録へ（クラウドにも）、カードと録音はこの端末へ =====
const recId = (owner, part, at) => owner+'|'+part+'|'+at;
const RDB={p:null,
  open(){ if(this.p) return this.p; this.p=new Promise(res=>{ if(!window.indexedDB) return res(null); try{ const q=indexedDB.open('yomista-rec',1);
    q.onupgradeneeded=()=>{ q.result.createObjectStore('rec',{keyPath:'id'}); }; q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); q.onblocked=()=>res(null); }catch(e){ res(null); } }); return this.p; },
  async put(v){ const d=await this.open(); if(!d) return false; return new Promise(res=>{ try{ const tx=d.transaction('rec','readwrite'), os=tx.objectStore('rec'); os.put(v);
      tx.oncomplete=()=>res(true); tx.onerror=tx.onabort=()=>res(false); }catch(e){ res(false); } }); },
  async get(id){ const d=await this.open(); if(!d) return null; return new Promise(r=>{ try{ const q=d.transaction('rec').objectStore('rec').get(id); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }catch(e){ r(null); } }); },
  // 同じおはなしの古い録音と、新しい KEEP_AUDIO 回より前の録音は、音だけ消す（カードは300枚までのこす）
  async prune(keepId){ const d=await this.open(); if(!d) return; try{ const tx=d.transaction('rec','readwrite'), os=tx.objectStore('rec'); const all=[]; const q=os.openCursor();
    q.onsuccess=()=>{ const c=q.result; if(c){ const v=c.value; all.push({id:v.id, at:v.at||0, blob:!!v.blob, key:String(v.id).split('|').slice(0,2).join('|')}); c.continue(); return; }
      all.sort((a,b)=>b.at-a.at); const keep=all.find(x=>x.id===keepId); const seen=new Set(); let nb=0;
      all.forEach((x,i)=>{ if(i>=300){ os.delete(x.id); return; } if(!x.blob) return; const drop=(keep && x.id!==keepId && x.key===keep.key) || seen.has(x.key) || nb>=KEEP_AUDIO; seen.add(x.key);
        if(drop){ const g=os.get(x.id); g.onsuccess=()=>{ const v=g.result; if(v){ v.blob=null; os.put(v); } }; } else nb++; }); }; }catch(e){} } };
function saveRecResult(res, blob, owner){ if(res.demo) return;
  if(P && P.id===owner){ if(!Array.isArray(S.recs)) S.recs=[]; S.recs.push({date:res.date, at:res.at, part:res.part, score:res.score, items:res.items, cpm:res.cpm, ai:res.ai}); if(S.recs.length>300) S.recs=S.recs.slice(-300); save(); }
  const id=recId(owner, res.part, res.at); RDB.put({id, at:res.at, res, blob:blob||null}).then(ok=>{ if(ok) RDB.prune(id); }); }

// ===== 評価をすすめる（問題・ルーレットのあいだに） =====
function evalTake(r, blob){
  const part=r.part, grade=gradeNow(), owner=P?P.id:'_'; const job=r.ev={st:'run', step:'録音をととのえています…'}; const upd=()=>{ if(R===r) updateRecCard(); };
  upd();
  (async()=>{
    let pcm, sr, an=null;
    try{ ({pcm,sr}=await decodeToMono(await blob.arrayBuffer(),16000)); an=analyzeTake(pcm, sr, part); }catch(e){ an=null; }
    if(!an){ r.ev={st:'empty'}; upd(); return; }
    const et=evalText(part); job.step='AIの先生が聞いています…（30秒〜1分ほど）'; upd();
    let g=null, err='';
    try{ g=await assessRemote(pcm, sr, an, et, grade, part.id); }catch(e){ err=(e&&e.pass?'pass:':'')+String(e&&e.message||e); }
    const res=buildResult(part, et, an, g, grade, err);
    r.ev={st:'done', res, url:URL.createObjectURL(blob)}; saveRecResult(res, blob, owner); upd();
    if(R===r){ if(res.speech) SFX.play[res.score>=80?'stamp':'correct'](); }
    else if(P && P.id===owner) toast('音読カードができたよ（「きろく」で見られるよ）');
  })();
}

// ===== 音読カード =====
function recCardHTML(ev){
  if(!ev) return '';
  if(ev.st==='run') return `<section class="card reccard pending" aria-live="polite"><div class="label">音読カード</div><div class="rc-wait"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>${esc(ev.step||'チェックしています…')}</span></div><p class="note" style="margin:0">${R&&R.recOnly?'すこし まってね。':'問題とルーレットをしているあいだに できあがるよ。'}</p></section>`;
  if(ev.st==='empty') return `<section class="card reccard"><div class="label">音読カード</div><p style="margin:0"><b>声が録音されていなかったみたい。</b><br>マイクに近づいて、もう一度よんでみよう。</p>${CAN_MIC?'<div class="row rc-btns"><button class="btn-ghost btn-small" type="button" data-rc="again">● もう一度 録音する</button></div>':''}</section>`;
  const res=ev.res; if(!res) return '';
  const I=res.items, c=res.counts;
  const it=(label,v,detail)=>`<li><span class="rc-k">${label}</span><span class="rc-m ${markCls(v)}" aria-label="${v==null?'評価なし':v+'点'}">${markOf(v)}</span><span class="rc-v">${detail}</span></li>`;
  const accDetail = I.acc==null ? 'AIの評価なし' : c ? ([c.missing?`とばし${c.missing}`:'', c.wrong?`ちがう${c.wrong}`:'', c.unclear?`聞きとりにくい${c.unclear}`:''].filter(Boolean).join('・')||'まちがいなし') : `${I.acc}点`;
  const pt = v => v==null ? 'AIの評価なし' : `${v}点`;
  const mk={}; (res.marks||[]).forEach(m=>{ mk[m.s+':'+m.c]=m; });
  // 印は文節ごと。とばしがつづくところは、ひとつながりの印にする
  const sentHTML = s => { let out='', open=false; (res.sents[s]||[]).forEach((ch,k)=>{ const m=mk[s+':'+k]; const h=rubyHTML(ch); const miss=!!m&&m.st==='missing';
      if(open && !miss){ out+='</span>'; open=false; }
      if(miss){ if(!open){ out+='<span class="mk mk-missing" title="聞こえなかった">'; open=true; } out+=h; return; }
      if(!m){ out+=h; return; }
      out+=`<span class="mk mk-${m.st}" title="${esc(m.heard?`「${m.heard}」に聞こえた`:'聞きとりにくかった')}">${h}</span>`; });
    if(open) out+='</span>'; return out; };
  let text='', cur=-1; (res.sents||[]).forEach((row,s)=>{ const pi=res.pis?res.pis[s]:s; if(pi!==cur){ if(cur>=0) text+='</p>'; text+='<p>'; cur=pi; } text+=sentHTML(s); });
  if(cur>=0) text+='</p>';
  const heard=(res.marks||[]).filter(m=>m.st!=='missing'&&m.heard).slice(0,6);
  const canModel = !!(R && R.part && R.part.id===res.part && (TTS || audioFor(R.part)));
  const markedS=[...new Set((res.marks||[]).map(m=>m.s))].sort((a,b)=>a-b), noR=(R&&R.ruby===false)?'noruby':'';
  const focus=markedS.slice(0,6).map(s=>`<p class="rc-sent">${canModel?`<button class="rc-play" type="button" data-rs="${s}" aria-label="この文のおてほんをきく">▶</button>`:''}<span>${sentHTML(s)}</span></p>`).join('');
  const head = res.speech===false ? `<div class="label">音読カード</div><p style="margin:0"><b>声が録音されていなかったみたい。</b><br>マイクに近づいて、もう一度よんでみよう。</p>`
    : `<div class="rc-head"><div><div class="label">音読カード${res.demo?'（サンプル）':''}</div><div class="rc-rank">${esc(rankOf(res.score))}</div></div><div class="rc-score"><span class="num">${res.score}</span><small>点</small></div></div>`;
  return `<section class="card reccard${res.demo?' demo':''}">${head}
    ${res.demo?`<p class="note" style="margin:0">これはサンプルです（録音はしていません）。${IN_CLAUDE?'Claude の画面の中ではマイクが使えないので、録音はブラウザで開いたウェブ版でできます。':''}</p>`:''}

const dayAdd = (date, add) => { const [y,m,d]=date.split('-').map(Number); const x=new Date(y,m-1,d+add); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
function stampReplay(){
  const st={n:0,chars:0,runs:0,hr:0,qok:0,qstreak:0,qbest:0,best:0,sure:0,done:new Set(),streak:0,streakBest:0,last:null,dayN:{},maxDay:0,morning:0,night:0};
  const step=x=>{ st.n++; st.chars+=x.chars||0; st.runs+=x.scored||0; if(x.hit===4) st.hr++;
    if(x.quiz===true){ st.qok++; st.qstreak++; st.qbest=Math.max(st.qbest,st.qstreak); } else if(x.quiz===false) st.qstreak=0;
    st.best=Math.max(st.best,x.cpm||0); if(x.sure) st.sure++; st.done.add(x.part);
    if(x.date && x.date!==st.last){ if(!st.last || x.date>st.last){ st.streak = (st.last && dayAdd(st.last,1)===x.date) ? st.streak+1 : 1; st.last=x.date; st.streakBest=Math.max(st.streakBest,st.streak); } }
    if(x.date){ st.dayN[x.date]=(st.dayN[x.date]||0)+1; st.maxDay=Math.max(st.maxDay,st.dayN[x.date]); }
    if(x.h!=null){ if(x.h<9) st.morning++; if(x.h>=19) st.night++; } };
  return {st, step};
}
function stampSessions(){ return S.sessions.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
function computeStamps(){ // id → もらった日（その条件を最初に満たしたセッションの日）
  const out={}; const pending=new Set(STAMPS.map(s=>s.id)); const rep=stampReplay();
  for(const x of stampSessions()){ rep.step(x); for(const id of pending){ if(STAMP_BY[id].cond(rep.st)){ out[id]=x.date; pending.delete(id); } } }
  // sessions に入っていない読破（古い記録）も拾う
  for(const pid of Object.keys(S.done||{})) rep.st.done.add(pid);
  for(const id of pending){ if(STAMP_BY[id].cond(rep.st)) out[id]=todayKey(); }
  return out;
}
function stampStatsNow(){ const rep=stampReplay(); for(const x of stampSessions()) rep.step(x); for(const pid of Object.keys(S.done||{})) rep.st.done.add(pid); return rep.st; }
function awardStamps(){ // 新しくもらえた id の配列を返す（記録もする）
  if(!S.stamps||typeof S.stamps!=='object') S.stamps={}; if(!Array.isArray(S.stampNew)) S.stampNew=[];
  const earned=computeStamps(); const fresh=[];
  for(const id of Object.keys(earned)){ if(!S.stamps[id]){ S.stamps[id]=earned[id]; fresh.push(id); } }
  if(fresh.length){ S.stampNew.push(...fresh); save(); }
  return fresh;
}

function stampHint(d, st){ if(!d.prog) return d.hint; const p=d.prog(st); const left=p.goal-p.cur; return left>0 && p.goal>1 ? `あと${left}${p.unit}` : d.hint; }

const UNIT_COST = {'話':1,'日':1,'問':1.2,'点':1.6,'本':4,'回':5,'字':1/600,'字/分':1/25};

function chartSVG(points, opts={}){ // points: [{x:label, y:cpm, hr:bool}]
  const W=400, H=200, L=38, Rr=12, T=18, B=30; if(!points.length) return `<p class="muted">まだ記録がありません。1話よむとグラフが出ます。</p>`;
  const ys=points.map(p=>p.y); const raw=Math.max(...ys, 100); const stepv=[25,50,100,200,500,1000,2000].find(s=>raw/s<=5)||5000; const ymax=Math.ceil(raw/stepv)*stepv; const ymin=0;
  const n=points.length; const xs=i=> n===1? (L+W-Rr)/2 : L+(W-L-Rr)*i/(n-1); const yv=v=> T+(H-T-B)*(1-(v-ymin)/(ymax-ymin));
  const ticks=[]; for(let v=0;v<=ymax;v+=stepv) ticks.push(v);
  const path=points.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)} ${yv(p.y).toFixed(1)}`).join(' ');
  const area=`${path} L${xs(n-1).toFixed(1)} ${yv(0)} L${xs(0).toFixed(1)} ${yv(0)} Z`;
  const step=Math.max(1,Math.ceil(n/6));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="読む速さの推移">
    ${ticks.map(v=>`<line class="axis" x1="${L}" x2="${W-Rr}" y1="${yv(v)}" y2="${yv(v)}"/><text x="${L-6}" y="${yv(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <path class="area" d="${area}"/><path class="ln" d="${path}"/>
    ${points.map((p,i)=>`<circle class="pt ${p.hr?'hr':''} ${i===n-1?'last':''}" cx="${xs(i)}" cy="${yv(p.y)}" r="4.5"/>`).join('')}
    ${points.map((p,i)=> (i%step===0||i===n-1)?`<text x="${xs(i)}" y="${H-10}" text-anchor="middle">${esc(p.x)}</text>`:'').join('')}
    <text x="${L}" y="${T-4}" font-weight="700">字/分</text>
  </svg>`;
}

// 「読み込み」：書き出した記録を、いまの記録に足し合わせる（同じ記録は1つにまとめる）
function mergeState(d){
  const add=Object.assign(defaults(), JSON.parse(JSON.stringify(d||{}))); const fresh=!S.sessions.length;
  const key=x=>x.date+'|'+x.part+'|'+x.t; const seen=new Set(S.sessions.map(key)); let n=0;
  for(const x of (Array.isArray(add.sessions)?add.sessions:[])){ if(x && x.date && x.part && !seen.has(key(x))){ S.sessions.push(x); seen.add(key(x)); S.done[x.part]=true; n++; } }
  S.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const rs=new Set(S.recs.map(x=>x.at)); for(const x of (Array.isArray(add.recs)?add.recs:[])){ if(x && x.at && !rs.has(x.at)){ S.recs.push(x); rs.add(x.at); n++; } }
  S.recs.sort((a,b)=>a.at-b.at); if(S.recs.length>300) S.recs=S.recs.slice(-300);
  for(const [k,v] of Object.entries(add.runs||{})) S.runs[k]=Math.max(S.runs[k]||0, +v||0);
  for(const [k,v] of Object.entries(add.done||{})) if(v) S.done[k]=true;
  for(const [k,v] of Object.entries(add.stamps||{})) if(v && !S.stamps[k]) S.stamps[k]=v;
  const ws=new Set(S.words.map(w=>w.w)); for(const w of (Array.isArray(add.words)?add.words:[])){ if(w && w.w && !ws.has(w.w)){ S.words.push(w); ws.add(w.w); } }
  if(fresh){ S.bases=Array.isArray(add.bases)?add.bases:[]; S.outs=+add.outs||0; }
  migrate(); return n;
}

const toHira = s => s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));

  return n<=1100&&k<0.12?1 : n<=1800&&k<0.2?2 : k<0.27?3 : 4; }
const RUBY_POLICY={
  normal:'小学3年生までに習う漢字だけでできた、よく使う語にはつけない。それ以外（小学4年生より上で習う漢字や、むずかしい読み方の語）にはつける。',
  more:'小学1年生で習う漢字（一・人・山・川・日・月・大・小 など）だけでできた語にはつけない。それ以外の漢字をふくむ語には、ぜんぶつける。',
  less:'小学6年生までに習う漢字だけでできたふつうの語にはつけない。中学校で習う漢字・むずかしい読み方・むかしのことばにだけつける。',
  all:'漢字をふくむ語には、すべてつける。'
};
const GRADE_OF={0:'小学3〜4年生',1:'小学2年生',2:'小学3年生',3:'小学4年生',4:'小学5年生',5:'小学6年生'};
function partPrompt(o){
  return `あなたは小学生向けの音読・読解アプリ「よみスタ」の編集者です。下の【本文】は、子どもが声に出して読むおはなし「${o.title}」の一部です（全${o.n}パート・約${o.total}字のうち、${o.i+1}パートめ）。
次の形のJSONだけを返してください。説明の文は書かないでください。
{"paras":["…"]${o.quiz?',"quiz":{"q":"…？","choices":["正解","まちがい","まちがい"],"why":"…"}':''}${o.first?',"blurb":"…","level":2':''}}

■ paras（ふりがなをつけた本文）
・【本文】と同じ数・同じ順番の段落の配列にする。
・本文の文字は一字も変えない。句読点・かぎかっこ・空白・カタカナ、すでについている ｜…《…》 も、そのまま残す。ふりがなを足すだけにする。
・ふりがなは ｜漢字《よみ》 の形で、よみはひらがな。送りがなは《》の外に出す（例：｜聞《き》いて、｜美《うつく》しい）。熟語は語ごとにまとめる（例：｜去年《きょねん》）。
・ふりがなをつける語：${RUBY_POLICY[o.ruby]||RUBY_POLICY.normal}
・読みまちがえやすい語（今日・明日・一日・大人・上手・何人 など）や、文脈で読みが変わる語には、上のきまりに関係なく、文脈に合った読みでつける。この読みは音声の読み上げにも使う。${o.quiz?`

■ quiz（読みとり問題を1問）
・このパートを読めば答えられる、だいじな出来事・気持ち・理由をきく問題にする。
・${GRADE_OF[o.level]||GRADE_OF[0]}にわかることばで。q は30字以内で「？」で終える。choices はそれぞれ20字以内。
・choices は3つ。1つめが正解。のこり2つは、本文に出てくることばを使った、もっともらしいまちがいにする。
・why は、正解の理由を本文にそって1〜2文で（60字以内）。`:''}${o.first?`

■ blurb：おはなし全体の紹介を、つづきを読みたくなる1文で（35字以内。結末は書かない）。
■ level：1〜5の数。1=甘口（短く、ひらがなが多い）、2=中辛、3=辛口（長めで漢字が多い）、4=激辛（むかしのことばが多い・長い）、5=超辛（宮沢賢治など、とてもむずかしい）。`:''}

【本文】（JSONの配列。1つが1段落）
${JSON.stringify(o.paras)}`;
}
async function runPool(jobs, k){ let next=0; const worker=async()=>{ while(next<jobs.length){ const j=next++; await jobs[j](); } }; await Promise.all(Array.from({length:Math.min(k,jobs.length)}, worker)); }
const STOP_CODES=new Set(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','rate_limited','session_expired','cancelled','queue_overflow','prompt_too_large']);

async function saveStory(st){
  const clean=JSON.parse(JSON.stringify(st)); delete clean._local;
  userStories=userStories.filter(x=>x.id!==st.id).concat([st]); cacheUserStories(); rebuildIndex();
  if(!DB){ st._local=true; cacheUserStories(); return 'local'; }
  try{ await DB.doc('stories/'+st.id).set(clean); delete st._local; cacheUserStories(); return 'cloud'; }
  catch(e){ st._local=true; cacheUserStories(); return e && e.code==='quota_exceeded' ? 'full' : 'local'; }
}
async function deleteStory(id){
  userStories=userStories.filter(x=>x.id!==id); cacheUserStories(); rebuildIndex();
  if(DB){ try{ await DB.doc('stories/'+id).delete(); }catch(e){ toast('クラウドからけせませんでした。あとでもう一度けしてください'); } }
}
// クラウドの「追加したおはなし」を見はる（ほかの端末で追加しても本だなに出る）
let storiesUnsub=null; const uploadTried=new Set();
function watchStories(){
  if(!DB || storiesUnsub) return;
  try{
    storiesUnsub = DB.collection('stories').onSnapshot(snap=>{
      const list=[]; snap.docs.forEach(d=>{ try{ const b=JSON.parse(JSON.stringify(d.data()||{})); if(validStory(b) && b.src==='user') list.push(b); }catch(e){} });
      const pending=userStories.filter(s=>s._local && !list.find(x=>x.id===s.id));
      userStories=list.concat(pending); cacheUserStories(); rebuildIndex();
      pending.forEach(s=>{ if(uploadTried.has(s.id)) return; uploadTried.add(s.id); saveStory(s); });
      if(P && !R && (tab==='home'||tab==='records'||tab==='parent') && !inputFocused()) render();
    }, ()=>{ /* つながらないときは、この端末の写しで続ける */ });
  }catch(e){}
}

const ADD_DRAFT='yomista.addDraft';
function renderAdd(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(ADD_DRAFT)||'{}')||{}; }catch(e){ d={}; }
  view.innerHTML = `<section class="card stack" id="a-form">
    <div class="readhead"><div><div class="label">おうちの人</div><h2>おはなしを ふやす</h2></div><button class="toggle" id="a-back" type="button">もどる</button></div>
    <p class="note" style="margin:0">教科書や問題集の文章、青空文庫のおはなしを貼りつけると、約500字ごとのパートに分けて本だなに入れます。Claude が子ども向けのふりがな（読み上げの読みにも使います）と、パートごとの読みとり問題をつけます。登録したらすぐ、おてほんの読み上げで聞けます。</p>
    <div class="field"><label for="a-title">タイトル</label><input id="a-title" maxlength="40" placeholder="例：ごんぎつね" value="${esc(d.title||'')}"></div>
    <div class="field"><label for="a-author">作者・出典（なくてもOK）</label><input id="a-author" maxlength="40" placeholder="例：新美南吉（青空文庫）" value="${esc(d.author||'')}"></div>
    <div class="grid2">
      <div class="field"><label for="a-level">レベル</label><select id="a-level"><option value="0">Claude にまかせる</option>${[1,2,3,4,5].map(l=>`<option value="${l}">${LEVELS[l]}</option>`).join('')}</select></div>
      <div class="field"><label for="a-ruby">ふりがな</label><select id="a-ruby"><option value="normal">ふつう（小3までの漢字にはつけない）</option><option value="more">おおめ（小1の漢字にだけつけない）</option><option value="less">すくなめ（小6までの漢字にはつけない）</option><option value="all">ぜんぶの漢字に</option></select></div>
    </div>
    <div class="field"><label for="a-text">本文（1行が1段落。青空文庫のルビ《》や注記［＃…］はそのままでOK）</label><textarea id="a-text" rows="11" placeholder="ここに本文を貼りつけます">${esc(d.text||'')}</textarea><div class="note" id="a-count"></div></div>
    <label class="check" for="a-quiz"><input type="checkbox" id="a-quiz" checked> 読みとり問題を Claude がつくる（1パート1問）</label>
    <p class="note" id="a-claude" style="margin:0">Claude を使えるか確認しています…</p>
    <button class="btn-main" id="a-go" type="button">登録して よんでみる</button>
  </section>
  <section class="card stack" id="a-run" hidden>
    <div class="label" id="ar-label">じゅんび中</div>
    <h2 id="ar-title"></h2>
    <ol class="arsteps" id="ar-steps"></ol>
    <p class="note" id="ar-note" style="margin:0"></p>
    <button class="btn-ghost" id="ar-cancel" type="button">やめる</button>
  </section>`;
  if(d.level) $('#a-level').value=String(d.level); if(d.ruby) $('#a-ruby').value=d.ruby; if(d.quiz===false) $('#a-quiz').checked=false;
  const form=()=>({title:$('#a-title').value.trim(), author:$('#a-author').value.trim(), level:+$('#a-level').value||0, ruby:$('#a-ruby').value, quiz:$('#a-quiz').checked, text:$('#a-text').value});
  let dt=0; const draft=()=>{ clearTimeout(dt); dt=setTimeout(()=>{ try{ const f=form(); localStorage.setItem(ADD_DRAFT, JSON.stringify(f)); }catch(e){} },400); };
  const count=()=>{ const paras=normalizeInput($('#a-text').value); const n=paras.map(plain).join('').length; const el=$('#a-count');
    if(!n){ el.textContent='まだ本文がありません'; return; }
    const g=splitIntoParts(paras); el.textContent = n>30000 ? `${n.toLocaleString()}字：長すぎます。3万字までに分けて登録してください` : `${n.toLocaleString()}字 → ${g.length}パート（1パート 約${Math.round(n/g.length)}字）`; };
  ['#a-title','#a-author','#a-text'].forEach(s=>$(s).addEventListener('input',()=>{ draft(); if(s==='#a-text') count(); }));
  ['#a-level','#a-ruby','#a-quiz'].forEach(s=>$(s).addEventListener('change',draft));
  count();
  $('#a-back').addEventListener('click',()=>setTab('parent'));
  sampleFn().then(fn=>{ const el=$('#a-claude'); if(!el) return;
    if(fn){ el.innerHTML='ふりがなと問題は Claude がつくります（1パート 20〜40秒ほど。はじめての時は、Claude を使ってよいかの確認が出ます）。'; }
    else { el.innerHTML='いまの表示では Claude を呼べないため、<b>ふりがな・問題なし</b>で登録します（本文に《》のルビがあれば使います）。claude.ai にログインして開くと、Claude が自動でつけます。'; $('#a-quiz').checked=false; $('#a-quiz').disabled=true; } });
  $('#a-go').addEventListener('click',()=>{ const f=form(); const paras=normalizeInput(f.text);
    if(!f.title){ toast('タイトルを入れてください'); $('#a-title').focus(); return; }
    if(!paras.length){ toast('本文を貼りつけてください'); $('#a-text').focus(); return; }
    if(paras.map(plain).join('').length>30000){ toast('長すぎます。3万字までに分けてください'); return; }
    importStory(f, paras); });
}
async function importStory(f, paras){
  // 貼った本文の頭にタイトルや作者名の行があれば、本文からはずす
  const same=(line,s)=>{ const a=plain(line).replace(/[\s　]/g,''), b=String(s||'').replace(/[\s　]/g,''); return !!a && !!b && (a===b || (a.length>=2 && b.startsWith(a))); };
  while(paras.length>1 && (same(paras[0], f.title) || same(paras[0], f.author))) paras=paras.slice(1);
  const groups=splitIntoParts(paras); const total=groups.reduce((a,g)=>a+g.map(plain).join('').length,0);
  const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const job={ctl:new AbortController(), cancelled:false, stop:false}; ADD=job;
  $('#a-form').hidden=true; const run=$('#a-run'); run.hidden=false; window.scrollTo(0,0);
  $('#ar-title').textContent=`「${f.title}」を ${groups.length}パートに分けました`;
  $('#ar-steps').innerHTML=groups.map((g,i)=>`<li data-i="${i}"><span>パート${i+1}</span><small>${g.map(plain).join('').length}字</small><b>まち</b></li>`).join('');
  const mark=(i,st,txt)=>{ const li=$(`#ar-steps li[data-i="${i}"]`); if(!li) return; li.dataset.st=st; li.querySelector('b').textContent=txt; };
  $('#ar-cancel').onclick=()=>{ job.cancelled=true; job.ctl.abort(); ADD=null; setTab('add'); toast('やめました。本文はのこしてあります'); };
  const sample=await sampleFn();
  const parts=groups.map((g,i)=>({id:`${id}p${i+1}`, paras:g.slice(), chars:0, quiz:null}));
  let blurb='', level=f.level||0, failed=0, stopped=false;
  if(sample){
    $('#ar-label').textContent='Claude が じゅんび中';
    $('#ar-note').textContent=`ふりがなと${f.quiz?'問題':''}をつくっています。1パート 20〜40秒ほど、2パートずつ同時にすすみます。`;
    await runPool(groups.map((g,i)=>async()=>{
      if(job.cancelled) return; if(job.stop){ mark(i,'skip','ふりがな・問題なし'); return; }
      mark(i,'doing','つくり中…');
      try{
        const r=await sample.json(partPrompt({title:f.title, n:groups.length, total, i, paras:g, ruby:f.ruby, quiz:f.quiz, first:i===0, level:f.level}), {modelTier:'default', signal:job.ctl.signal});
        if(job.cancelled) return;
        parts[i].paras = mergeRuby(g.join('\n'), Array.isArray(r&&r.paras) ? r.paras.map(x=>String(x==null?'':x)).join('\n') : '').split('\n');
        if(f.quiz) parts[i].quiz = cleanQuiz(r&&r.quiz);
        if(i===0 && r){ if(typeof r.blurb==='string') blurb=r.blurb.trim().slice(0,60); const lv=Math.round(+r.level); if(!f.level && lv>=1 && lv<=5) level=lv; }
        mark(i,'done', f.quiz && !parts[i].quiz ? 'ふりがなだけ' : 'できた');
      }catch(e){
        if(job.cancelled) return;
        const code=e&&e.code; if(STOP_CODES.has(code)){ job.stop=true; stopped=code; }
        failed++; mark(i,'skip','ふりがな・問題なし');
      }
    }), 2);
  } else { groups.forEach((g,i)=>mark(i,'skip','ふりがな・問題なし')); }
  if(job.cancelled) return;
  parts.forEach(p=>{ p.chars=p.paras.map(plain).join('').length; });
  const first=plain(paras[0]||''); const st={id, title:f.title.slice(0,40), author:f.author.slice(0,40)||'おうちの人が追加', url:'', level:level||guessLevel(groups),
    blurb: blurb || (first.length>30 ? first.slice(0,28)+'……' : first), chars:parts.reduce((a,p)=>a+p.chars,0), parts, src:'user', added:new Date().toISOString(), ruby:f.ruby};
  $('#ar-label').textContent='ほぞん中';
  const where=await saveStory(st); ADD=null;
  try{ localStorage.removeItem(ADD_DRAFT); }catch(e){}
  if(stopped==='not_granted' || stopped==='sampling_disabled') toast('Claude を使えなかったので、ふりがな・問題なしで登録しました');
  else if(stopped==='rate_limited') toast('Claude の利用上限に近いため、一部はふりがな・問題なしで登録しました');
  else if(failed) toast(`${failed}パートは ふりがな・問題なしで登録しました`);
  else toast(where==='cloud' ? `「${st.title}」を本だなに入れました` : where==='full' ? 'クラウドがいっぱいのため、この端末にだけ保存しました' : `「${st.title}」をこの端末に保存しました`);
  SFX.play.stamp();
  startRead(parts[0].id);
}

try{ P=JSON.parse(localStorage.getItem(PKEY)||'null'); }catch(e){ P=null; }
LASTP = P; P=null;
view.innerHTML='<p class="muted" style="text-align:center">よみこみ中…</p>';
rebuildIndex();
initCloud();
})();
