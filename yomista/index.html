<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>よみスタ</title><meta name="description" content="小学生の音読アプリ。声に出して読む → 問題 → ルーレット。録音すると、AIの先生が音読カードをつくります。"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#2f8f5b"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23fff' stroke='%23c96f36' stroke-width='1.5'/%3E%3Cpath d='M7 4.5c2.5 3 2.5 12 0 15M17 4.5c-2.5 3-2.5 12 0 15' fill='none' stroke='%23c96f36' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Dots&display=swap">
<style>
/* 設計: 野球場。昼の芝（ライト）と、ナイター（ダーク）。本文は丸ゴシックで大きく、数字はスコアボード風。
   ホーム=今日の試合、よむ=1画面集中、きろく=成績表、おうちの人=監督ノート */
:root{
  --bg:#eef3ea; --surface:#ffffff; --surface2:#f7faf4; --fg:#1b2a1f; --muted:#5e6f60; --line:#cfdcc9;
  --grass:#2f8f5b; --grass-ink:#ffffff; --grass-soft:#dcefe2; --grass-deep:#1f6b43;
  --clay:#c96f36; --clay-soft:#f6e3d6; --chalk:#ffffff; --gold:#d9a93a;
  --read:#fff2cc;
  --font-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Meiryo',sans-serif;
  --font-score:'Zen Dots','Zen Maru Gothic',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a14; --surface:#182620; --surface2:#1f2f28; --fg:#edf3ea; --muted:#a3b5a6; --line:#2d3f34;
    --grass:#4cc47d; --grass-ink:#0d1a12; --grass-soft:#1d3b2b; --grass-deep:#2f8f5b;
    --clay:#e2905a; --clay-soft:#3d2a1e; --chalk:#f3f6f1; --gold:#ffcd5a; --read:#3a3416;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a14; --surface:#182620; --surface2:#1f2f28; --fg:#edf3ea; --muted:#a3b5a6; --line:#2d3f34;
  --grass:#4cc47d; --grass-ink:#0d1a12; --grass-soft:#1d3b2b; --grass-deep:#2f8f5b;
  --clay:#e2905a; --clay-soft:#3d2a1e; --chalk:#f3f6f1; --gold:#ffcd5a; --read:#3a3416;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;border-radius:14px;padding:.7rem 1.1rem;background:var(--surface2);color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-main{background:var(--grass);color:var(--grass-ink);font-weight:900;font-size:1.25rem;padding:1rem 1.4rem;border-radius:18px;width:100%}
.btn-clay{background:var(--clay);color:#fff;font-weight:900}
.btn-ghost{background:transparent;border:2px solid var(--line);font-weight:700}
.btn-small{font-size:.9rem;padding:.45rem .8rem;border-radius:10px}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:.55rem .7rem}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:1.15rem;font-weight:900}
.num{font-family:var(--font-score);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.label{font-size:.72rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--grass);color:var(--grass-ink);
  padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.top .brand{font-weight:900;font-size:1.15rem;display:flex;align-items:center;gap:.5rem}
.top .brand svg{width:26px;height:26px}
.top .day{font-size:.85rem;font-weight:700;opacity:.9;text-align:right;line-height:1.3}
.top .sync{font-size:.7rem;font-weight:500;opacity:.85}
.top .right{display:flex;align-items:center;gap:.6rem}
.top .snd{background:rgba(255,255,255,.2);color:var(--grass-ink);border-radius:999px;padding:0;width:36px;height:36px;display:grid;place-items:center;flex:none}
.top .snd[aria-pressed="false"]{opacity:.6}
.top .snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;padding-block:1rem 6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--line);
  display:flex;justify-content:space-around;padding-top:.35rem;padding-bottom:calc(.35rem + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{background:transparent;color:var(--muted);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.4rem .9rem;font-size:.8rem;border-radius:12px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--grass);background:var(--grass-soft)}

.card{background:var(--surface);border-radius:18px;padding:1rem;border:1px solid var(--line)}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:.75rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem}

/* スコアボード（ラインスコア風） */
.board{background:#15221a;color:#f5f1e3;border-radius:18px;padding:.7rem .8rem .8rem;border:3px solid #2e3f33;box-shadow:inset 0 0 0 2px #0c150f}
.board .bhead{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:1rem;margin:0 .2rem .45rem;letter-spacing:.04em}
.board .bhead small{font-weight:700;color:#aeb9a9;font-size:.75rem;margin-left:.3rem}
.board .lamp{display:inline-flex;gap:5px;align-items:center}
.board .lamp i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#3a4a3f;border:1px solid #556b5c}
.board .lamp i.on{background:#ffd166;box-shadow:0 0 6px #ffd166}
.board .lamp i.red{background:#ff6b57;box-shadow:0 0 6px #ff6b57}
.board .lamps{display:inline-flex;gap:.7rem}
.board table.line{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed;font-size:.9rem}
.board table.line th,.board table.line td{padding:.3rem 0;text-align:center;border:0;background:#1d2d23;border-radius:5px;font-variant-numeric:tabular-nums}
.board table.line thead th{color:#aeb9a9;font-size:.72rem;font-weight:700;background:transparent;letter-spacing:.06em}
.board table.line tbody th{color:#f5f1e3;font-size:.72rem;font-weight:900;text-align:left;padding-left:.2rem;background:transparent;width:4.4em;white-space:nowrap}
.board table.line td{font-family:var(--font-score);font-size:1.25rem;line-height:1;color:#ffd166}
.board table.line tr.runs td{color:#9be7b5;font-size:1.05rem}
.board table.line .today{background:#2a4030}
.board table.line thead th.today{color:#9be7b5;background:transparent}
.board table.line td.tot{background:#0f1b14;color:#fff}
.board table.line tr.runs td.tot{color:#9be7b5}
.diamond{width:120px;height:120px;max-width:100%}
.diamond .base{fill:var(--chalk);stroke:var(--clay);stroke-width:3}
.diamond .base.on{fill:var(--gold)}
.diamond .field{fill:var(--grass-soft)}
.diamond .dirt{fill:var(--clay-soft)}

/* 今日のおはなし */
.pick{display:grid;gap:.6rem}
.story{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;text-align:left;padding:.9rem 1rem;border-radius:16px;background:var(--surface);border:2px solid var(--line);width:100%}
.story:hover{border-color:var(--grass)}
.lvb{display:inline-block;font-size:.72rem;font-weight:900;padding:.18rem .55rem;border-radius:999px;color:#fff;white-space:nowrap;letter-spacing:.04em;vertical-align:middle;line-height:1.2}
.lvb.l1{background:#3f9a5c}.lvb.l2{background:#c99a2b}.lvb.l3{background:#e06f2a}.lvb.l4{background:#cf3b3b}.lvb.l5{background:#7a1f3d}
.story .lvb{align-self:center}
.lv{display:inline-flex;flex-direction:column;gap:3px;align-items:center;vertical-align:middle}
.story .lv{display:flex}
.lv i{display:block;width:10px;height:10px;border-radius:50%;background:var(--line)}
.lv i.on{background:var(--grass)}
.story .t{font-weight:900;font-size:1.05rem}
.story .s{font-size:.82rem;color:var(--muted)}
.story .go{font-weight:900;color:var(--grass);font-size:1.3rem}
.story.cont{border-color:var(--clay);background:var(--clay-soft)}
.tag{display:inline-block;font-size:.7rem;font-weight:900;padding:.1rem .5rem;border-radius:999px;background:var(--clay);color:#fff;margin-right:.3rem;vertical-align:middle}

/* ことばチップ */
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{background:var(--surface);border:2px solid var(--gold);border-radius:999px;padding:.35rem .85rem;font-weight:900}
.chip.open{background:var(--read);font-weight:500}

/* 読む画面 */
.readhead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.readhead h2{font-size:1.2rem}
.toggles{display:flex;gap:.4rem;flex-wrap:wrap}
.toggle{border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;padding:.35rem .7rem;border-radius:999px}
.toggle[aria-pressed="true"]{background:var(--grass-soft);border-color:var(--grass);color:var(--grass)}
.timerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.5rem .9rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.timerbar .num{font-size:1.9rem;line-height:1}
.timerbar .round{font-weight:900;color:var(--clay)}
.text{background:var(--surface);border-radius:18px;padding:1.25rem 1.1rem;border:1px solid var(--line);font-size:var(--read-size,1.4rem);line-height:2.15;letter-spacing:.02em}
.text p{margin:0 0 1.1em}
.text p:last-child{margin-bottom:0}
.text.noruby rt{display:none}
.text rt{font-size:.5em;color:var(--muted);letter-spacing:0}
.text .c.on{background:var(--read);border-radius:3px}
.text .sn{border-radius:4px;cursor:pointer}
.text .sn.now{background:var(--read);box-shadow:0 0 0 3px var(--read)}
.text .sn.done{color:var(--muted)}
.voicebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.6rem .9rem;display:flex;flex-direction:column;gap:.5rem}
.voicebar .row{justify-content:space-between}
.voicebar .ctl{display:flex;gap:.4rem}
.voicebar .ctl button{font-weight:900;padding:.55rem .9rem}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border-radius:0;padding:.35rem .7rem;font-size:.85rem;font-weight:700;background:transparent}
.seg button[aria-pressed="true"]{background:var(--grass-soft);color:var(--grass)}
.btn-sub{background:var(--surface);border:2px solid var(--grass);color:var(--grass);font-weight:900;font-size:1.05rem;padding:.8rem 1.2rem;border-radius:18px;width:100%}
.text.chapter{text-align:center;font-weight:900}
.ready{text-align:center;display:flex;flex-direction:column;gap:.9rem;align-items:center}
.ready .big{font-size:1.3rem;font-weight:900}
.sheet{position:sticky;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));z-index:4}
.quiz .choice{display:block;width:100%;text-align:left;font-weight:700;font-size:1.05rem;padding:.9rem 1rem;background:var(--surface);border:2px solid var(--line);margin-top:.5rem}
.quiz .choice.ok{border-color:var(--grass);background:var(--grass-soft)}
.quiz .choice.ng{border-color:var(--clay);background:var(--clay-soft)}
.result{text-align:center}
.result .verdict{font-size:2rem;font-weight:900;color:var(--clay);margin:.2rem 0}
.result .verdict.hr{color:var(--gold);text-shadow:0 2px 0 var(--clay)}
.result .verdict.out{color:var(--muted)}
.wheelwrap{position:relative;width:min(260px,80vw);margin:0 auto .6rem}
.wheelwrap .pin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:1.4rem;color:var(--clay);z-index:2;line-height:1}
.wheel{width:100%;height:auto;display:block;transform:rotate(0deg);cursor:pointer}
.book{text-align:left;cursor:pointer;font-family:inherit}
.book:hover{border-color:var(--grass)}
.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center;margin:1rem 0}
.compare .num{font-size:1.7rem;line-height:1.1}
.compare .arrow{font-size:1.6rem;color:var(--muted)}
.compare .k{font-size:.75rem;color:var(--muted);font-weight:700}

/* 記録 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.6rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.7rem .8rem}
.stat .num{font-size:1.6rem;line-height:1.1;color:var(--grass)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
.chart .axis{stroke:var(--line)}
.chart .ln{fill:none;stroke:var(--grass);stroke-width:2.5;stroke-linejoin:round}
.chart .area{fill:var(--grass);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--grass);stroke-width:2}
.chart .pt.last{fill:var(--clay);stroke:var(--clay)}
.chart .pt.hr{fill:var(--gold);stroke:var(--clay)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.book{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;min-width:0}
.book .t{font-weight:900;font-size:.95rem}
.book .a{font-size:.75rem;color:var(--muted)}
.book .p{height:6px;border-radius:3px;background:var(--line);margin-top:.4rem;overflow:hidden}
.book .p i{display:block;height:100%;background:var(--grass)}
.book.done{border-color:var(--gold);background:linear-gradient(0deg,var(--surface),var(--surface)),var(--surface)}
.book.done .t::after{content:" ★";color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.45rem .3rem;border-bottom:1px solid var(--line)}
th{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}
.tablewrap{overflow-x:auto}

/* おうちの人 */
.field{display:grid;gap:.3rem}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.words li{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line)}
.words{list-style:none;margin:0;padding:0}
.danger{background:var(--clay-soft);color:var(--clay);font-weight:900}
textarea{width:100%;min-height:90px;font-size:.8rem}
.note{font-size:.85rem;color:var(--muted)}
.srcs{font-size:.75rem;color:var(--muted)}
.srcs a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.5rem 1rem;border-radius:999px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s}
.toast{pointer-events:none}
.toast.show{opacity:1}
/* スタンプちょう */
.stampbook{display:flex;flex-direction:column;gap:.7rem}
.sb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.sb-head .num{font-size:1.6rem;color:var(--clay);line-height:1.1;white-space:nowrap}
.sb-next{font-size:.85rem;color:var(--muted)}
.sb-next b{color:var(--clay);font-family:var(--font-score);font-size:1rem}
.sb-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.sb-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--gold));border-radius:5px;transition:width .6s}
.sb-sub{font-size:.8rem;font-weight:900;color:var(--fg);letter-spacing:.06em;margin-top:.2rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:.7rem .2rem}
.stamp{background:none;border:0;padding:.15rem 0 .2rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;text-align:center;position:relative;min-width:0;font-family:inherit;color:inherit;cursor:pointer;border-radius:12px}
.stamp:hover{background:var(--surface2)}
.stamp svg{width:74px;height:74px;display:block}
.stamp .sn{font-weight:900;font-size:.76rem;line-height:1.25;overflow-wrap:anywhere;padding:0 .1rem}
.stamp .sd{font-size:.66rem;color:var(--muted);line-height:1.2}
.stamp.locked .art{filter:grayscale(1);opacity:.3}
.stamp.locked .sn{color:var(--muted);font-weight:700}
.stamp .new{position:absolute;top:0;right:6%;background:var(--clay);color:#fff;font-size:.58rem;font-weight:900;padding:.08rem .4rem;border-radius:999px;letter-spacing:.06em;animation:pop .5s ease-out;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.stampget{background:var(--read);border-radius:16px;padding:.7rem .6rem .5rem;margin:.6rem 0 .2rem}
.stampget .label{color:var(--clay)}
.stampget .sgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem .6rem;margin-top:.3rem}
.stampget .stamp{width:104px;animation:pop .6s ease-out}
.stampget .stamp svg{width:92px;height:92px}
.statbtn{text-align:left;font-family:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:.7rem .8rem;background:var(--surface)}
.statbtn .num{font-size:1.6rem;line-height:1.1;color:var(--grass)}
.statbtn .num span{font-size:.9rem;color:var(--muted)}
.statbtn .label.next{letter-spacing:0;text-transform:none;font-weight:700;margin-top:.15rem}
.statbtn .label.next b{color:var(--clay)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .5s ease-out}
/* おてほんプレイヤー：シャドーイングの再生バーを、球場の色で。聞いている間は下のタブの代わりに出る */
.listening .tabs{display:none}
.listening main{padding-bottom:calc(14.5rem + env(safe-area-inset-bottom,0px))}
.listening .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 4.4rem)}
.lp{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);box-shadow:0 -6px 22px rgba(15,35,22,.12);
  padding-top:.55rem;padding-bottom:calc(.55rem + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lp-in{max-width:720px;margin:0 auto;display:grid;gap:.5rem}
.lp-row{display:flex;align-items:center;gap:.5rem;min-width:0;flex-wrap:wrap}
.lp-top{justify-content:space-between;gap:.4rem}
.lp-spd{justify-content:center;gap:.4rem;flex-wrap:nowrap}
.lp-ctl{justify-content:center;gap:1.1rem;flex-wrap:nowrap}
.lp .seg button{padding:.3rem .5rem;font-size:.8rem}
.lp-rep{border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.75rem;padding:.3rem .5rem;border-radius:999px;white-space:nowrap}

<script src="https://cdn.jsdelivr.net/npm/budoux@0.9.3/bundle/budoux-ja.min.js" async></script>
<script>const BUILTIN_STORIES = [{"id":"s05","title":"こぞうさんの おきょう","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4727_13219.html","level":1,"blurb":"おきょうをわすれたこぞうさん。うさぎが教えてくれたのは……","chars":656,"parts":[{"id":"s05p1","paras":["やまでらの おしょうさんが びょうきに なりましたので、かわりに こぞうさんが だんかへ おきょうを よみに いきました。","おきょうを わすれないように、こぞうさんは みちみち よんで いきました。","キミョ","ムリョ","ジュノ","ライ","すると なたねばたけの なかに うさぎが いて、","「こぼうず あおぼうず。」","と よびました。","「なんだい。」","「あそんで おいきよ。」","そこで、こぞうさんは うさぎと あそびました。しばらく すると、","「やっ しまった。おきょうを わすれちゃった。」","と こぞうさんが さけびました。","すると うさぎは、","「そんなら おきょうの かわりに、","むこうの ほそみち","ぼたんが さいた","と おうたいよ。」","と おしえました。","こぞうさんは だんかへ いきました。そして、うさぎの おしえて くれたように、ほとけさまの まえで、","むこうの ほそみち","ぼたんが さいた","さいた さいた","ぼたんが さいた","と かわいい こえで うたいました。","きいて いた ひとびとは びっくり して 目を ぱちくり させました。それから くすくす わらいだしました。こんな かわいい おきょうは きいた ことが ありません。","そこで、ごほうじが すむと、だんかの ごしゅじんは すました かおで、","「はい、ごくろうさま。」","と、おまんじゅうを こぞうさんに あげました。","「ごちそうさま。」","と こぞうさんは おまんじゅうを いただいて たもとに いれました。","こぞうさんは、かえりに その おまんじゅうを、さっきの うさぎに わけて やる ことを わすれませんでした。"],"chars":656,"quiz":{"q":"こぞうさんがおきょうのかわりにうたったのは？","choices":["「むこうのほそみち ぼたんがさいた」","「キミョ ムリョ」","「さいた さいた さくらがさいた」"],"why":"うさぎに教えてもらった「むこうの ほそみち ぼたんが さいた」をかわいい声でうたいました。"}}]},{"id":"s10","title":"里の春、山の春","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4676_8216.html","level":1,"blurb":"春を知らない坊やの鹿が、「ぼオん」という音をきいて……","chars":728,"parts":[{"id":"s10p1","paras":["野原にはもう春がきていました。","｜桜《さくら》がさき、小鳥はないておりました。","けれども、山にはまだ春はきていませんでした。","山のいただきには、雪も白くのこっていました。","山のおくには、おやこの｜鹿《しか》がすんでいました。","｜坊《ぼう》やの｜鹿《しか》は、生まれてまだ一年にならないので、春とはどんなものか知りませんでした。","「お父ちゃん、春ってどんなもの。」","「春には花がさくのさ。」","「お母ちゃん、花ってどんなもの。」","「花ってね、きれいなものよ。」","「ふウん。」","けれど、｜坊《ぼう》やの｜鹿《しか》は、花をみたこともないので、花とはどんなものだか、春とはどんなものだか、よくわかりませんでした。","ある日、｜坊《ぼう》やの｜鹿《しか》はひとりで山のなかを遊んで歩きまわりました。","すると、とおくのほうから、","「ぼオん。」","とやわらかな音が聞こえてきました。","「なんの音だろう。」","するとまた、","「ぼオん。」","｜坊《ぼう》やの｜鹿《しか》は、ぴんと耳をたててきいていました。やがて、その音にさそわれて、どんどん山をおりてゆきました。","山の下には野原がひろがっていました。野原には｜桜《さくら》の花がさいていて、よいかおりがしていました。","いっぽんの｜桜《さくら》の木の｜根《ね》かたに、やさしいおじいさんがいました。","｜仔鹿《こじか》をみるとおじいさんは、｜桜《さくら》をひとえだ｜折《お》って、その小さい｜角《つの》にむすびつけてやりました。","「さア、かんざしをあげたから、日のくれないうちに山へおかえり。」","｜仔鹿《こじか》はよろこんで山にかえりました。","｜坊《ぼう》やの｜鹿《しか》からはなしをきくと、お父さん｜鹿《じか》とお母さん｜鹿《じか》は口をそろえて、","「ぼオんという音はお｜寺《てら》のかねだよ。」","「おまえの｜角《つの》についているのが花だよ。」","「その花がいっぱいさいていて、きもちのよいにおいのしていたところが、春だったのさ。」","とおしえてやりました。","それからしばらくすると、山のおくへも春がやってきて、いろんな花はさきはじめました。"],"chars":728,"quiz":{"q":"「ぼオん」という音はなんだった？","choices":["お寺のかね","かみなり","たいこ"],"why":"お父さん鹿とお母さん鹿が「ぼオんという音はお寺のかねだよ」と教えてくれました。"}}]},{"id":"s03","title":"去年の木","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4719_13221.html","level":1,"blurb":"なかよしの木をさがして、小鳥がとんでいく。","chars":791,"parts":[{"id":"s03p1","paras":["いっぽんの木と、いちわの小鳥とはたいへんなかよしでした。小鳥はいちんちその木の｜枝《えだ》で歌をうたい、木はいちんちじゅう小鳥の歌をきいていました。","けれど寒い冬がちかづいてきたので、小鳥は木からわかれてゆかねばなりませんでした。","「さよなら。また来年きて、歌をきかせてください。」","と木はいいました。","「え。それまで待っててね。」","と、小鳥はいって、南の方へとんでゆきました。","春がめぐってきました。野や森から、雪がきえていきました。","小鳥は、なかよしの｜去年《きょねん》の木のところへまたかえっていきました。","ところが、これはどうしたことでしょう。木はそこにありませんでした。根っこだけがのこっていました。","「ここに立ってた木は、どこへいったの。」","と小鳥は根っこにききました。","根っこは、","「きこりが｜斧《おの》でうちたおして、谷のほうへもっていっちゃったよ。」","といいました。","小鳥は谷のほうへとんでいきました。","谷の｜底《そこ》には大きな工場があって、木をきる音が、びィんびィん、としていました。","小鳥は工場の門の上にとまって、","「門さん、わたしのなかよしの木は、どうなったか知りませんか。」","とききました。","門は、","「木なら、工場の中でこまかくきりきざまれて、マッチになってあっちの村へ売られていったよ。」","といいました。"],"chars":524,"quiz":{"q":"春にもどってきた小鳥が見つけたのは？","choices":["木の根っこだけ","大きくなった木","新しい小鳥"],"why":"木はきこりに切られて、根っこだけがのこっていました。"}},{"id":"s03p2","paras":["小鳥は村のほうへとんでいきました。","ランプのそばに女の子がいました。","そこで小鳥は、","「もしもし、マッチをごぞんじありませんか。」","とききました。","すると女の子は、","「マッチはもえてしまいました。けれどマッチのともした火が、まだこのランプにともっています。」","といいました。","小鳥は、ランプの火をじっとみつめておりました。","それから、｜去年《きょねん》の歌をうたって火にきかせてやりました。火はゆらゆらとゆらめいて、こころからよろこんでいるようにみえました。","歌をうたってしまうと、小鳥はまたじっとランプの火をみていました。それから、どこかへとんでいってしまいました。"],"chars":267,"quiz":{"q":"小鳥はさいごに、だれに歌をきかせた？","choices":["ランプの火","女の子","工場の門"],"why":"木はマッチになり、その火がランプにともっていました。小鳥は火に歌をきかせました。"}}]},{"id":"s09","title":"一年生たちとひよめ","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4717_13213.html","level":1,"blurb":"「だんごやるに、くぐれ」とうたうと、ひよめは……","chars":839,"parts":[{"id":"s09p1","paras":["学校へいくとちゅうに、大きな｜池《いけ》がありました。","一年生たちが、朝そこを通りかかりました。","池の中にはひよめが｜五六《ごろ》っぱ、黒くうかんでおりました。","それをみると一年生たちは、いつものように声をそろえて、","ひイよめ、","ひよめ、","だんごやアるに","くウぐウれッ、","とうたいました。","するとひよめは頭からぷくりと水のなかにもぐりました。だんごがもらえるのをよろこんでいるようにみえました。","けれど一年生たちは、ひよめにだんごをやりませんでした。学校へゆくのにだんごなどもっている子はありません。","一年生たちは、それから学校にきました。","学校では先生が教えました。","「みなさん、うそをついてはなりません。うそをつくのはたいへんわるいことです。むかしの人は、うそをつくと死んでから｜赤鬼《あかおに》に、｜舌《した》べろを｜釘《くぎ》ぬきでひっこぬかれるといったものです。うそをついてはなりません。さあ、わかった人は手をあげて。」","みんなが手をあげました。みんなよくわかったからであります。","さて学校がおわると、一年生たちはまた池のふちを通りかかったのでありました。","ひよめはやはりおりました。一年生たちのかえりを待っていたかのように、水の上からこちらをみていました。"],"chars":491,"quiz":{"q":"学校で先生が教えたことは？","choices":["うそをついてはいけない","だんごをあげなさい","池であそんではいけない"],"why":"「うそをつくのはたいへんわるいこと」と先生が教えました。"}},{"id":"s09p2","paras":["ひイよめ、","ひよめ、","と一年生たちは、いつものくせでうたいはじめました。","しかし、そのあとをつづけてうたうものはありませんでした。「だんごやるに、くぐれ」とうたったら、それはうそをいったことになります。うそをいってはならない、と｜今日《きょう》学校でおそわったばかりではありませんか。","さて、どうしたものでしょう。","このままいってしまうのもざんねんです。そしたらひよめのほうでも、さみしいと思うにちがいありません。","そこでみんなは、こう歌いました。","ひイよめ、","ひよめ、","だんご、やらないけれど、","くウぐウれッ","するとひよめは、やはりいせいよく、くるりと水をくぐったのであります。","これで、わかりました。ひよめはいままで、だんごがほしいから、くぐったのではありません。一年生たちによびかけられるのがうれしいからくぐったのであります。"],"chars":348,"quiz":{"q":"ひよめが水をくぐったほんとうのわけは？","choices":["よびかけられるのがうれしいから","だんごがほしいから","水がつめたいから"],"why":"「だんご、やらないけれど」とうたってもくぐったので、よびかけがうれしかったとわかりました。"}}]},{"id":"s01","title":"二ひきの蛙","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4718_13223.html","level":1,"blurb":"色がちがう二ひきの蛙のけんか。春になると……","chars":942,"parts":[{"id":"s01p1","paras":["緑の｜蛙《かえる》と黄色の｜蛙《かえる》が、はたけのまんなかでばったりゆきあいました。","「やあ、きみは黄色だね。きたない色だ。」","と緑の｜蛙《かえる》がいいました。","「きみは緑だね。きみはじぶんを美しいと思っているのかね。」","と黄色の｜蛙《かえる》がいいました。","こんなふうに話しあっていると、よいことは｜起《お》こりません。二ひきの｜蛙《かえる》はとうとうけんかをはじめました。","緑の｜蛙《かえる》は黄色の｜蛙《かえる》の上にとびかかっていきました。この｜蛙《かえる》はとびかかるのが｜得意《とくい》でありました。","黄色の｜蛙《かえる》はあとあしで｜砂《すな》をけとばしましたので、あいてはたびたび目玉から｜砂《すな》をはらわねばなりませんでした。","するとそのとき、寒い風がふいてきました。","二ひきの｜蛙《かえる》は、もうすぐ冬のやってくることをおもいだしました。｜蛙《かえる》たちは土の中にもぐって寒い冬をこさねばならないのです。","「春になったら、このけんかの｜勝負《しょうぶ》をつける。」","といって、緑の｜蛙《かえる》は土にもぐりました。","「いまいったことをわすれるな。」","といって、黄色の｜蛙《かえる》ももぐりこみました。","寒い冬がやってきました。｜蛙《かえる》たちのもぐっている土の上に、びゅうびゅうと北風がふいたり、｜霜柱《しもばしら》が立ったりしました。","そしてそれから、春がめぐってきました。","土の中にねむっていた｜蛙《かえる》たちは、せなかの上の土があたたかくなってきたのでわかりました。"],"chars":512,"quiz":{"q":"二ひきの蛙はどうしてけんかをやめて土にもぐったの？","choices":["もうすぐ冬が来るとおもいだしたから","おなかがすいたから","お母さんによばれたから"],"why":"寒い風がふいて、冬が来ることを思い出したので、勝負は春に、と決めました。"}},{"id":"s01p2","paras":["さいしょに、緑の｜蛙《かえる》が目をさましました。土の上に出てみました。まだほかの｜蛙《かえる》は出ていません。","「おいおい、おきたまえ。もう春だぞ。」","と土の中にむかってよびました。","すると、黄色の｜蛙《かえる》が、","「やれやれ、春になったか。」","といって、土から出てきました。","「｜去年《きょねん》のけんか、わすれたか。」","と緑の｜蛙《かえる》がいいました。","「待て待て。からだの土をあらいおとしてからにしようぜ。」","と黄色の｜蛙《かえる》がいいました。","二ひきの｜蛙《かえる》は、からだから｜泥土《どろつち》をおとすために、｜池《いけ》のほうにいきました。","｜池《いけ》には新しくわきでて、ラムネのようにすがすがしい水がいっぱいにたたえられてありました。そのなかへ｜蛙《かえる》たちは、とぶんとぶんととびこみました。","からだをあらってから緑の｜蛙《かえる》が目をぱちくりさせて、","「やあ、きみの黄色は美しい。」","といいました。","「そういえば、きみの緑だってすばらしいよ。」","と黄色の｜蛙《かえる》がいいました。","そこで二ひきの｜蛙《かえる》は、","「もうけんかはよそう。」","といいあいました。","よくねむったあとでは、人間でも｜蛙《かえる》でも、きげんがよくなるものであります。"],"chars":430,"quiz":{"q":"春になって、池で体をあらったあと、二ひきはなんと言った？","choices":["「もうけんかはよそう」","「もう一度けんかだ」","「さようなら」"],"why":"きれいな水であらったら、おたがいの色が美しく見えて、けんかをやめました。"}}]},{"id":"s02","title":"がちょうの たんじょうび","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4726_13211.html","level":1,"blurb":"たんじょうびのパーティーに、いたちをよぶ？よばない？","chars":1062,"parts":[{"id":"s02p1","paras":["ある おひゃくしょうやの うらにわに あひるや、がちょうや、もるもっとや、うさぎや、いたちなどが すんで おりました。","さて、ある ひの こと がちょうの たんじょうびと いうので、みんなは がちょうの ところへ ごちそうに まねかれて いきました。","これで、いたちさえ よんで くれば、みんな おきゃくが そろう わけですが、さて、いたちは どう しましょう。","みんなは いたちは けっして わるものでは ない ことを しって おりました。けれど、いたちには たった ひとつ、よく ない くせが ありました。それは おおぜいの まえでは、いう ことが できないような くせで ありました。なにかと もうしますと、ほかでも ありません、おおきな はげしい おならを する ことで あります。","しかし、いたちだけを よばないと いたちは きっと おこるに ちがい ありません。","そこで、うさぎが いたちの ところへ つかいに やって いきました。","「きょうは がちょうさんの たんじょうびですから おでかけ ください」","「あ、そうですか」","「ところで、いたちさん、ひとつ おねがいが あるのですが」"],"chars":490,"quiz":{"q":"いたちの「よくないくせ」ってなに？","choices":["おおきなおならをすること","大きな声でうたうこと","ごちそうをひとりじめすること"],"why":"おおぜいの前では言えないような、大きなおならをするくせでした。"}},{"id":"s02p2","paras":["「なんですか」","「あの、すみませんが、きょうだけは おならを しないで ください」","いたちは はずかしくて、かおを まっかに しました。そして、","「ええ、けっして しません」","と こたえました。","そこで いたちは やって いきました。","いろいろな ごちそうが でました。おからや、にんじんの しっぽや、うりの かわや、おぞうすいや。","みんなは たらふく たべました。いたちも ごちそうに なりました。","みんなは いい ぐあいだと おもって いました。いたちが おならを しなかったからで あります。","しかし、とうとう、たいへんな ことが おこりました。いたちが とつぜん ひっくりかえって、きぜつして しまったのです。","さあ、たいへん。さっそく、もるもっとの おいしゃが、いたちの ぽんぽこに ふくれた おなかを しんさつしました。","「みなさん」と もるもっとは、しんぱいそうに して いる みんなの かおを みまわして いいました。「これは、いたちさんが、おならを したいのを あまり がまんして いたので こんな ことに なったのです。これを なおすには、いたちさんに おもいきり おならを させるより しかたは ありません」","やれやれ。みんなの ものは ためいきを して かおを みあわせました。そして やっぱり いたちは よぶんじゃ なかったと おもいました。"],"chars":572,"quiz":{"q":"いたちはどうしてきぜつしてしまったの？","choices":["おならをがまんしすぎたから","たべすぎたから","ころんだから"],"why":"おならをしたいのをがまんしすぎて、おなかがふくれてしまったのです。"}}]},{"id":"s08","title":"蟹のしょうばい","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4674_8214.html","level":2,"blurb":"とこやをはじめた蟹。お客さんは、たこと、たぬき。","chars":969,"parts":[{"id":"s08p1","paras":["｜蟹《かに》がいろいろ考えたあげく、とこやをはじめました。｜蟹《かに》の考えとしてはおおできでありました。","ところで、｜蟹《かに》は、","「とこやというしょうばいは、たいへんひまなものだな。」","と思いました。と｜申《もう》しますのは、ひとりもお客さんがこないからであります。","そこで、｜蟹《かに》のとこやさんは、はさみをもって海っぱたにやっていきました。そこにはたこがひるねをしていました。","「もしもし、たこさん。」","と｜蟹《かに》はよびかけました。","たこはめをさまして、","「なんだ。」","といいました。","「とこやですが、ごようはありませんか。」","「よくごらんよ。わたしの頭に毛があるかどうか。」","｜蟹《かに》はたこの頭をよくみました。なるほど毛はひとすじもなく、つるんこでありました。いくら｜蟹《かに》がじょうずなとこやでも、毛のない頭をかることはできません。","｜蟹《かに》は、そこで、山へやっていきました。山にはたぬきがひるねをしていました。","「もしもし、たぬきさん。」","たぬきはめをさまして、","「なんだ。」","といいました。","「とこやですがごようはありませんか。」","たぬきは、いたずらがすきなけものですから、よくないことを考えました。","「よろしい、かってもらおう。ところで、ひとつやくそくしてくれなきゃいけない。というのは、わたしのあとで、わたしのお父さんの毛もかってもらいたいのさ。」"],"chars":528,"quiz":{"q":"たこの頭をかれなかったのはなぜ？","choices":["毛が一本もなかったから","たこがねていたから","はさみがこわれたから"],"why":"たこの頭はつるんこで、毛が一本もありませんでした。"}},{"id":"s08p2","paras":["「へい、おやすいことです。」","そこで、｜蟹《かに》のうでをふるうときがきました。","ちょっきん、ちょっきん、ちょっきん。","ところが、｜蟹《かに》というものは、あまり大きなものではありません。｜蟹《かに》とくらべたら、たぬきはとんでもなく大きなものであります。その上たぬきというものは、からだじゅうが毛むくじゃらであります。ですから仕事はなかなかはかどりません。｜蟹《かに》は口から｜泡《あわ》をふいていっしょうけんめいはさみをつかいました。そして三日かかって、やっとのこと仕事はおわりました。","「じゃ、やくそくだから、わたしのお父さんの毛もかってくれたまえ。」","「お父さんというのは、どのくらい大きなかたですか。」","「あの山くらいあるかね。」","｜蟹《かに》はめんくらいました。そんなに大きくては、とてもじぶんひとりでは、まにあわぬと思いました。","そこで｜蟹《かに》は、じぶんの子どもたちをみなとこやにしました。子どもばかりか、まごもひこも、うまれてくる｜蟹《かに》はみなとこやにしました。","それでわたくしたちが道ばたにみうける、ほんに小さな｜蟹《かに》でさえも、ちゃんとはさみをもっています。"],"chars":441,"quiz":{"q":"たぬきのお父さんはどのくらい大きい？","choices":["山くらい","たぬきの二ばい","家くらい"],"why":"「あの山くらいあるかね」と言われて、蟹はめんくらいました。"}}]},{"id":"s07","title":"飴だま","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4723_13209.html","level":2,"blurb":"舟の上で、ふたりの子どもが飴だまをほしがると……","chars":970,"parts":[{"id":"s07p1","paras":["春のあたたかい日のこと、わたし｜舟《ぶね》にふたりの小さな子どもをつれた女の｜旅人《たびびと》がのりました。","｜舟《ふね》が出ようとすると、","「おオい、ちょっとまってくれ。」","と、どての向こうから手をふりながら、さむらいがひとり走ってきて、舟にとびこみました。","｜舟《ふね》は出ました。","さむらいは舟のまん中にどっかりすわっていました。ぽかぽかあたたかいので、そのうちにいねむりをはじめました。","黒いひげをはやして、つよそうなさむらいが、こっくりこっくりするので、子どもたちはおかしくて、ふふふと｜笑《わら》いました。","お母さんは口に指をあてて、","「だまっておいで。」","といいました。さむらいがおこってはたいへんだからです。","子どもたちはだまりました。","しばらくするとひとりの子どもが、","「かあちゃん、｜飴《あめ》だまちょうだい。」","と手をさしだしました。","すると、もうひとりの子どもも、","「かあちゃん、あたしにも。」","といいました。","お母さんはふところから、紙のふくろをとりだしました。ところが、｜飴《あめ》だまはもう一つしかありませんでした。","「あたしにちょうだい。」","「あたしにちょうだい。」","ふたりの子どもは、りょうほうからせがみました。｜飴《あめ》だまは一つしかないので、お母さんはこまってしまいました。"],"chars":495,"quiz":{"q":"お母さんがこまったのはなぜ？","choices":["飴だまが一つしかなかったから","さむらいがおこったから","舟がゆれたから"],"why":"ふくろの中の飴だまは一つだけ。ふたりともほしがって、こまってしまいました。"}},{"id":"s07p2","paras":["「いい子たちだから待っておいで、向こうへついたら買ってあげるからね。」","といってきかせても、子どもたちは、ちょうだいよオ、ちょうだいよオ、とだだをこねました。","いねむりをしていたはずのさむらいは、ぱっちり｜眼《め》をあけて、子どもたちがせがむのをみていました。","お母さんはおどろきました。いねむりをじゃまされたので、このおさむらいはおこっているのにちがいない、と思いました。","「おとなしくしておいで。」","と、お母さんは子どもたちをなだめました。","けれど子どもたちはききませんでした。","するとさむらいが、すらりと｜刀《かたな》をぬいて、お母さんと子どもたちのまえにやってきました。","お母さんはまっさおになって、子どもたちをかばいました。いねむりのじゃまをした子どもたちを、さむらいがきりころすと思ったのです。","「｜飴《あめ》だまを出せ。」","とさむらいはいいました。","お母さんはおそるおそる｜飴《あめ》だまをさしだしました。","さむらいはそれを｜舟《ふね》のへりにのせ、刀でぱちんと二つにわりました。","そして、","「そオれ。」","とふたりの子どもにわけてやりました。","それから、またもとのところにかえって、こっくりこっくりねむりはじめました。"],"chars":475,"quiz":{"q":"さむらいは刀でなにをした？","choices":["飴だまを二つにわった","子どもをおどかした","舟をたたいた"],"why":"さむらいは飴だまを舟のへりにのせ、刀でぱちんと二つにわって、わけてあげました。"}}]},{"id":"s12","title":"星の銀貨","author":"グリム兄弟（楠山正雄訳）","url":"https://www.aozora.gr.jp/cards/001091/files/42316_15930.html","level":2,"blurb":"もっているものをぜんぶあげてしまった女の子に、空から……","chars":1034,"parts":[{"id":"s12p1","paras":["むかし、むかし、小さい女の子がありました。この子には、おとうさんもおかあさんもありませんでした。たいへんびんぼうでしたから、しまいには、もう住むにもへやはないし、もうねるにも｜寝床《ねどこ》がないようになって、とうとうおしまいには、からだにつけたもののほかは、手にもったパンひとかけきりで、それもなさけぶかい人がめぐんでくれたものでした。","でも、この子は、心のすなおな、信心のあつい子でありました。それでも、こんなにして世の中からまるで見すてられてしまっているので、この子は、やさしい神さまのお力にだけすがって、ひとりぼっち、野原の上をあるいて行きました。すると、そこへ、びんぼうらしい男が出て来て、","「ねえ、なにかたべるものをおくれ。おなかがすいてたまらないよ。」と、いいました。","女の子は、もっていたパンひとかけのこらず、その男にやってしまいました。そして、","「どうぞ神さまのおめぐみのありますように。」と、いのってやって、またあるきだしました。すると、こんどは、こどもがひとり泣きながらやって来て、","「あたい、あたまがさむくて、こおりそうなの。なにかかぶるものちょうだい。」と、いいました。"],"chars":487,"quiz":{"q":"女の子は、おなかのすいた男になにをあげた？","choices":["パンをぜんぶ","ずきん","上着"],"why":"たった一つのパンを、のこらずその男にあげました。"}},{"id":"s12p2","paras":["そこで、女の子は、かぶっていたずきんをぬいで、子どもにやりました。","それから、女の子がまたすこし行くと、こんど出て来たこどもは、着物一枚着ずにふるえていました。そこで、じぶんの｜上着《うわぎ》をぬいで着せてやりました。それからまたすこし行くと、こんど出てきたこどもは、スカートがほしいというので、女の子はそれもぬいで、やりました。","そのうち、女の子はある森にたどり｜着《つ》きました。もうくらくなっていましたが、また、もうひとりこどもが出て来て、｜肌着《はだぎ》をねだりました。あくまで心のすなおな女の子は、（もうまっくらになっているからだれにもみられやしないでしょう。いいわ、肌着もぬいであげることにしましょう。）と、おもって、とうとう肌着までぬいで、やってしまいました。","さて、それまでしてやって、それこそ、ないといって、きれいさっぱりなくなってしまったとき、たちまち、たかい空の上から、お星さまがばらばらおちて来ました。しかも、それがまったくの、ちかちかと｜白銀色《はくぎんいろ》をした、ターレル銀貨でありました。そのうえ、ついいましがた、肌着をぬいでやってしまったばかりなのに、女の子は、いつのまにか新しい肌着をきていて、しかもそれは、この上なくしなやかな｜麻《あさ》の肌着でありました。","女の子は、銀貨をひろいあつめて、それで｜一生《いっしょう》ゆたかにくらしました。"],"chars":547,"quiz":{"q":"空からふってきたのは？","choices":["銀貨","雪","パン"],"why":"お星さまがばらばらおちてきて、それは白銀色の銀貨でした。"}}]},{"id":"s06","title":"王さまと靴屋","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/4721_13225.html","level":2,"blurb":"こじきのふりをした王さまが、靴屋のじいさんをためす。","chars":1044,"parts":[{"id":"s06p1","paras":["ある日、王さまはこじきのようなようすをして、ひとりで町へやってゆきました。","町には小さな｜靴屋《くつや》がいっけんあって、おじいさんがせっせと｜靴《くつ》をつくっておりました。","王さまは｜靴屋《くつや》の店にはいって、","「これこれ、じいや、そのほうはなんという名まえか。」","とたずねました。","｜靴屋《くつや》のじいさんは、そのかたが王さまであるとは知りませんでしたので、","「ひとにものをきくなら、もっとていねいにいうものだよ。」","と、つっけんどんにいって、とんとんと仕事をしていました。","「これ、名まえはなんと｜申《もう》すぞ。」","とまた王さまはたずねました。","「ひとにくちをきくには、もっとていねいにいうものだというのに。」","とじいさんはまた、ぶっきらぼうにいって、仕事をしつづけました。","王さまは、なるほどじぶんがまちがっていた、と思って、こんどはやさしく、","「おまえの名まえを教えておくれ。」","とたのみました。","「わしの名まえは、マギステルだ。」","とじいさんは、やっと名まえを教えました。","そこで王さまは、","「マギステルのじいさん、ないしょのはなしだが、おまえはこの国の王さまはばかやろうだとおもわないか。」","とたずねました。","「おもわないよ。」","とマギステルじいさんはこたえました。"],"chars":496,"quiz":{"q":"じいさんが王さまに名前を教えたのは、王さまがどうしたとき？","choices":["やさしくていねいにたのんだとき","お金を出したとき","大きな声でおこったとき"],"why":"「ひとにものをきくなら、もっとていねいに」と言われ、王さまはやさしくたのみなおしました。"}},{"id":"s06p2","paras":["「それでは、こゆびのさきほどばかだとはおもわないか。」","と王さまはまたたずねました。","「おもわないよ。」","とマギステルじいさんはこたえて、｜靴《くつ》のかかとをうちつけました。","「もしおまえが、王さまはこゆびのさきほどばかだといったら、わしはこれをやるよ。だれもほかにきいてやしないから、だいじょうぶだよ。」","と王さまは、金の時計をポケットから出して、じいさんのひざにのせました。","「この国の王さまがばかだといえばこれをくれるのかい。」","とじいさんは、金づちをもった手をわきにたれて、ひざの上の時計をみました。","「うん、小さい声で、ほんのひとくちいえばあげるよ。」","と王さまは手をもみあわせながらいいました。","するとじいさんは、やにわにその時計をひっつかんで｜床《ゆか》のうえにたたきつけました。","「さっさと出てうせろ。ぐずぐずしてるとぶちころしてしまうぞ。｜不忠者《ふちゅうもの》めが。この国の王さまほどごりっぱなおかたが、世界中にまたとあるかッ。」","そして、もっていた金づちをふりあげました。","王さまは｜靴屋《くつや》の店からとびだしました。とびだすとき、ひおいの｜棒《ぼう》にごつんと頭をぶつけて、大きなこぶをつくりました。","けれど王さまは、こころを花のようにあかるくして、","「わしの｜人民《じんみん》はよい人民だ。わしの人民はよい人民だ。」","とくりかえしながら、｜宮殿《きゅうでん》のほうへかえってゆきました。"],"chars":548,"quiz":{"q":"金の時計をもらえると言われて、じいさんはどうした？","choices":["ゆかにたたきつけた","よろこんでうけとった","王さまにかえした"],"why":"じいさんは「王さまはばかだ」と言うのをことわり、時計をゆかにたたきつけました。"}}]},{"id":"s04","title":"赤い蝋燭","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/627_13466.html","level":2,"blurb":"猿がひろった赤い蝋燭。山のみんなは花火だと思って……","chars":1096,"parts":[{"id":"s04p1","paras":["山から里の方へ遊びにいった｜猿《さる》が一本の赤い｜蝋燭《ろうそく》を拾いました。赤い蝋燭は｜沢山《たくさん》あるものではありません。それで猿は赤い蝋燭を花火だと思い込んでしまいました。","猿は拾った赤い蝋燭を大事に山へ持って帰りました。","山ではたいへんな｜騒《さわ》ぎになりました。何しろ花火などというものは、｜鹿《しか》にしても｜猪《しし》にしても｜兎《うさぎ》にしても、｜亀《かめ》にしても、｜鼬《いたち》にしても、｜狸《たぬき》にしても、｜狐《きつね》にしても、まだ一度も見たことがありません。その花火を猿が拾って来たというのであります。","「ほう、すばらしい」","「これは、すてきなものだ」","鹿や猪や兎や亀や鼬や狸や狐が押し合いへしあいして赤い蝋燭を｜覗《のぞ》きました。すると猿が、","「｜危《あぶ》ない危ない。そんなに近よってはいけない。爆発するから」といいました。","みんなは驚いて｜後込《しりごみ》しました。","そこで猿は花火というものが、どんなに大きな音をして｜飛《と》び｜出《だ》すか、そしてどんなに美しく空にひろがるか、みんなに話して聞かせました。そんなに美しいものなら見たいものだとみんなは思いました。","「それなら、今晩山の｜頂上《てっぺん》に行ってあそこで打ち上げて見よう」と猿がいいました。みんなはたいへん喜びました。夜の空に星をふりまくようにぱあっとひろがる花火を｜眼《め》に浮かべてみんなはうっとりしました。"],"chars":507,"quiz":{"q":"猿はひろった赤い蝋燭をなんだと思った？","choices":["花火","あめ","ろうそく"],"why":"赤い蝋燭はめずらしいので、猿は花火だと思いこんでしまいました。"}},{"id":"s04p2","paras":["さて夜になりました。みんなは胸をおどらせて山の｜頂上《てっぺん》にやって行きました。猿はもう赤い蝋燭を木の枝にくくりつけてみんなの来るのを待っていました。","いよいよこれから花火を打ち上げることになりました。しかし困ったことが出来ました。と｜申《もう》しますのは、誰も花火に火をつけようとしなかったからです。みんな花火を見ることは好きでしたが火をつけにいくことは、好きでなかったのであります。","これでは花火はあがりません。そこでくじをひいて、火をつけに行くものを決めることになりました。第一にあたったものは亀でありました。","亀は元気を出して花火の方へやって行きました。だがうまく火をつけることが出来たでしょうか。いえ、いえ。亀は花火のそばまで来ると首が自然に｜引《ひ》っ｜込《こ》んでしまって出て来なかったのでありました。","そこでくじがまたひかれて、こんどは鼬が行くことになりました。鼬は亀よりは幾分ましでした。というのは首を引っ込めてしまわなかったからであります。しかし鼬はひどい｜近眼《きんがん》でありました。だから蝋燭のまわりをきょろきょろとうろついているばかりでありました。","とうとう猪が飛び出しました。猪は｜全《まった》く｜勇《いさ》ましい｜獣《けだもの》でした。猪はほんとうにやっていって火をつけてしまいました。","みんなはびっくりして草むらに飛び込み耳を固くふさぎました。耳ばかりでなく眼もふさいでしまいました。","しかし蝋燭はぽんともいわずに静かに燃えているばかりでした。"],"chars":589,"quiz":{"q":"ほんとうに火をつけたのはだれ？","choices":["猪","亀","鼬"],"why":"亀は首をひっこめ、鼬は近眼でうろうろ。勇ましい猪が火をつけました。"}}]},{"id":"s11","title":"ねずみの嫁入り","author":"楠山正雄","url":"https://www.aozora.gr.jp/cards/000329/files/18335_11944.html","level":2,"blurb":"日本一の娘に、日本一のお婿さんをさがす旅。","chars":1596,"parts":[{"id":"s11p1","paras":["むかし、むかし、ある｜家《いえ》のお｜倉《くら》の中に、お｜米《こめ》を｜持《も》って、｜麦《むぎ》を｜持《も》って、｜粟《あわ》を｜持《も》って、｜豆《まめ》を｜持《も》って、たいそうゆたかに｜暮《く》らしているお｜金《かね》｜持《も》ちのねずみが｜住《す》んでおりました。","｜子供《こども》がないので｜神《かみ》さまにお｜願《ねが》いしますと、やっと｜女《おんな》の子が｜生《う》まれました。その子はずんずん大きくなって、かがやくほど｜美《うつく》しくなって、それはねずみのお｜国《くに》でだれ｜一人《ひとり》くらべるもののない｜日本一《にほんいち》のいい｜娘《むすめ》になりました。","こうなると、もうねずみの｜仲間《なかま》には｜見《み》わたしたところ、とても｜娘《むすめ》のお｜婿《むこ》さんにするような｜者《もの》はありませんでした。ねずみのおとうさんとおかあさんは、","「うちの｜娘《むすめ》は｜日本一《にほんいち》の｜娘《むすめ》なのだから、｜何《なん》でも｜日本一《にほんいち》のお｜婿《むこ》さんをもらわなければならない。」","と｜言《い》いました。","そこでこの｜世《よ》の中でだれがいちばんえらいかというと、それは｜高《たか》い｜高《たか》い｜空《そら》の上から｜世界中《せかいじゅう》をあかるく｜照《て》らしておいでになるお日さまの｜外《ほか》にはありませんでした。そこでおとうさんはおかあさんと｜娘《むすめ》を｜連《つ》れて、｜天《てん》へ｜上《のぼ》っていきました。そしてお日さまに、","「お日さま、お日さま、あなたは｜世《よ》の中でいちばんえらいお｜方《かた》です。どうぞわたくしの｜娘《むすめ》をお｜嫁《よめ》にもらって｜下《くだ》さいまし。」","といって、ていねいにおじぎをしました。","するとお日さまはにこにこなさりながら、","「それはありがたいが、｜世《よ》の中にはわたしよりもっとえらいものがあるよ。」","とおっしゃいました。"],"chars":541,"quiz":{"q":"おとうさんねずみがさいしょにお婿さんにたのんだのは？","choices":["お日さま","雲","風"],"why":"世の中でいちばんえらいのはお日さまだと思って、天へのぼっていきました。"}},{"id":"s11p2","paras":["おとうさんはびっくりしました。","「まあ、あなたよりもえらい｜方《かた》があるのですか。それはどなたでございますか。」","「それは｜雲《くも》さ。わたしがいくら｜空《そら》でかんかん｜照《て》っていようと｜思《おも》っても、｜雲《くも》が出てくるともうだめになるのだからね。」","「なるほど。」","おとうさんはそこで、こんどは｜雲《くも》の｜所《ところ》へ出かけました。","「｜雲《くも》さん、｜雲《くも》さん、あなたは｜世《よ》の中でいちばんえらいお｜方《かた》です。どうぞわたくしの｜娘《むすめ》をお｜嫁《よめ》にもらって｜下《くだ》さいまし。」","「それはありがたいが、｜世《よ》の中にはわたしよりもっとえらいものがあるよ。」","おとうさんはびっくりしました。","「まあ、あなたよりもえらい｜方《かた》があるのですか。それはどなたでございますか。」","「それは｜風《かぜ》さ。｜風《かぜ》に｜吹《ふ》きとばされてはわたしもかなわないよ。」","「なるほど。」","おとうさんはそこで、こんどは｜風《かぜ》の｜所《ところ》へ出かけていきました。","「｜風《かぜ》さん、｜風《かぜ》さん、あなたは｜世《よ》の中でいちばんえらいお｜方《かた》です。どうぞわたくしの｜娘《むすめ》をお｜嫁《よめ》にもらって｜下《くだ》さいまし。」","「それはありがたいが、｜世《よ》の中にはわたしよりもっとえらいものがあるよ。」","おとうさんはびっくりしました。","「まあ、あなたよりもえらい｜方《かた》があるのですか。それはどなたでございますか。」"],"chars":481,"quiz":{"q":"雲が「わたしよりえらい」と言ったのは？","choices":["風","壁","ねずみ"],"why":"雲は「風に吹きとばされてはかなわない」と言いました。"}},{"id":"s11p3","paras":["「それは、｜壁《かべ》さ。｜壁《かべ》ばかりはわたしの｜力《ちから》でもとても、｜吹《ふ》きとばすことはできないからね。」","「なるほど。」","おとうさんはそこでまた、のこのこ｜壁《かべ》の｜所《ところ》へ出かけていきました。","「｜壁《かべ》さん、｜壁《かべ》さん、あなたは｜世《よ》の中でいちばんえらいお｜方《かた》です。どうぞうちの｜娘《むすめ》をお｜嫁《よめ》にもらって｜下《くだ》さいまし。」","「それはありがたいが、｜世《よ》の中にはわたしよりもっとえらいものがあるよ。」","おとうさんはびっくりしました。","「まあ、あなたよりもえらい｜方《かた》があるのですか。それはどなたでございますか。」","「それはだれでもない、そういうねずみさんさ。わたしがいくらまっ｜四角《しかく》な｜顔《かお》をして、｜固《かた》くなって、がんばっていても、ねずみさんはへいきでわたしの｜体《からだ》を｜食《く》い｜破《やぶ》って、｜穴《あな》をあけて｜通《とお》り｜抜《ぬ》けていくじゃないか。だからわたしはどうしてもねずみさんにはかなわないよ。」","「なるほど。」","とねずみのおとうさんは、こんどこそほんとうにしんから｜感心《かんしん》したように、ぽんと｜手《て》を｜打《う》って、","「これは｜今《いま》まで｜気《き》がつかなかった。じゃあわたしどもが｜世《よ》の中でいちばんえらいのですね。ありがたい。ありがたい。」","とにこにこしながら、いばって｜帰《かえ》っていきました。そして｜帰《かえ》るとさっそく、お｜隣《となり》のちゅう｜助《すけ》ねずみを｜娘《むすめ》のお｜婿《むこ》さんにしました。","｜若《わか》いお｜婿《むこ》さんとお｜嫁《よめ》さんは、｜仲《なか》よく｜暮《く》らして、おとうさんとおかあさんをだいじにしました。そしてたくさん｜子供《こども》を｜生《う》んで、お｜倉《くら》のねずみの｜一家《いっか》はますます｜栄《さか》えました。"],"chars":574,"quiz":{"q":"けっきょく、娘のお婿さんになったのは？","choices":["となりのちゅう助ねずみ","壁","風"],"why":"壁は「ねずみにかじられてはかなわない」。いちばんえらいのはねずみでした。"}}]},{"id":"s13","title":"和尚さんと小僧","author":"楠山正雄","url":"https://www.aozora.gr.jp/cards/000329/files/18387_11946.html","level":3,"blurb":"けちんぼな和尚さんと、ちえのまわる小僧さんのたたかい。","chars":2486,"parts":[{"id":"s13p1","paras":["一","｜大《たい》そうけちんぼな｜和尚《おしょう》さんがありました。｜何《なに》かよそからもらっても、いつでも｜自分《じぶん》｜一人《ひとり》でばかり｜食《た》べて、｜小僧《こぞう》には一つもくれませんでした。｜小僧《こぞう》はそれをくやしがって、いつかすきを｜見《み》つけて、｜和尚《おしょう》さんから、おいしいものを｜召《め》し｜上《あ》げてやろうと｜考《かんが》えていました。","ある日｜和尚《おしょう》さんは｜檀家《だんか》から、｜大《たい》そうおいしいあめをもらいました。｜和尚《おしょう》さんはそのあめをつぼの中に｜入《い》れて、そっと｜仏壇《ぶつだん》の下にかくして、ないしょで｜独《ひと》りでなめていました。","ところがある日、｜和尚《おしょう》さんは、｜用事《ようじ》があって｜外《そと》へ出て行きました。出て行きがけに、｜和尚《おしょう》さんは｜小僧《こぞう》にいいつけて、","「この｜仏壇《ぶつだん》の下のつぼには、だいじなものが｜入《はい》っている。｜見《み》かけはあめのようだけれど、ほんとうは、｜一口《ひとくち》でもなめたら、ころりとまいってしまうひどい｜毒薬《どくやく》だ。｜命《いのち》が｜惜《お》しいと｜思《おも》ったら、けっしてなめてはならないぞ。」","といい｜置《お》いて、出て｜行《い》きました。","｜和尚《おしょう》さんが出てしまうと、｜小僧《こぞう》はさっそくつぼを｜引《ひ》きずり｜出《だ》して、｜残《のこ》らずあめをなめてしまいました。それから｜和尚《おしょう》さんの｜大切《たいせつ》にしている｜茶《ちゃ》わんを、わざと｜真《ま》っ二つに｜割《わ》って、｜自分《じぶん》は｜布団《ふとん》をかぶって、うんうんうなりながら、いまにも｜死《し》にかけているようなふりをしていました。"],"chars":488,"quiz":{"q":"和尚さんは、つぼの中のあめを小僧になんだと言った？","choices":["毒薬","くすり","お茶"],"why":"「一口でもなめたらころりとまいる毒薬だ」と言って出かけました。"}},{"id":"s13p2","paras":["｜夕方《ゆうがた》になって、｜和尚《おしょう》さんが｜帰《かえ》って｜来《き》てみますと、中は｜真《ま》っ｜暗《くら》で、｜明《あか》りもついていませんでした。｜和尚《おしょう》さんはおこって、","「こらこら、｜小僧《こぞう》、｜何《なに》をしている。」","とどなりました。すると｜小僧《こぞう》は｜布団《ふとん》の中から、｜虫《むし》の｜鳴《な》くような｜声《こえ》を｜出《だ》して、","「｜和尚《おしょう》さん、ごめん｜下《くだ》さい。わたしは｜死《し》にます。もうとても｜助《たす》かりません。｜死《し》んだあとは、かわいそうだと｜思《おも》って、お｜経《きょう》の一つも｜読《よ》んで｜下《くだ》さい。」","といいました。","｜和尚《おしょう》さんは、だしぬけに｜妙《みょう》なことをいわれて、びっくりしました。","「｜小僧《こぞう》、｜小僧《こぞう》、いったいどうしたのだ。」","「きょう、｜和尚《おしょう》さんのだいじなお｜湯飲《ゆの》みを｜洗《あら》っていますと、いきなり｜猫《ねこ》がじゃれかかって｜来《き》て、そのひょうしに｜手《て》をすべらして、お｜湯飲《ゆの》みを｜落《お》としてこわしてしまいました。もうこれは｜死《し》んで｜申《もう》しわけをするよりほかはないと｜思《おも》って、つぼの中の｜毒薬《どくやく》を｜出《だ》して、｜残《のこ》らず｜食《た》べました。もう｜毒《どく》が｜体中《からだじゅう》に｜回《まわ》って、｜間《ま》もなく｜死《し》ぬでしょう。どうかかんにんして、お｜経《きょう》だけ｜読《よ》んでやって｜下《くだ》さい。ああ、｜苦《くる》しい、ああ、｜苦《くる》しい。」","といいながら、おいおい、おいおい、｜泣《な》きました。"],"chars":436,"quiz":{"q":"小僧は「死にます」と言って、ほんとうはなにをした？","choices":["あめをぜんぶなめて、茶わんをわった","ねぼうした","にげだした"],"why":"あめをのこらずなめ、わざと茶わんをわって、死にかけているふりをしました。"}},{"id":"s13p3","paras":["二","ある日、｜和尚《おしょう》さんは、｜御法事《ごほうじ》に｜呼《よ》ばれて行って、｜小僧《こぞう》が｜一人《ひとり》でお｜留守番《るすばん》をしていました。お｜経《きょう》を｜読《よ》みながら、うとうと｜居眠《いねむ》りをしていますと、｜玄関《げんかん》で、","「ごめん｜下《くだ》さい。」","と人の｜呼《よ》ぶ｜声《こえ》がしました。｜小僧《こぞう》があわてて、目をこすりこすり、行ってみますと、お｜隣《となり》のおばあさんが、大きなふろしき｜包《づつ》みを｜持《も》って｜来《き》て、","「おひがんでございますから、どうぞこれを｜和尚《おしょう》さんに｜上《あ》げて｜下《くだ》さい。」","といって、｜置《お》いて行きました。｜小僧《こぞう》はふろしき｜包《づつ》みを｜持《も》ち｜上《あ》げてみますと、中から｜温《あたた》かそうな｜湯気《ゆげ》が｜立《た》って、ぷんとおいしそうな｜匂《にお》いがしました。｜小僧《こぞう》は、","「ははあ、おひがんでお｜団子《だんご》をこしらえて｜持《も》って｜来《き》たのだな。これを｜和尚《おしょう》さんにこのまま｜渡《わた》してしまえば、どうせけちんぼで｜欲《よく》ばりの｜和尚《おしょう》さんのことだから、みんな｜自分《じぶん》で｜食《た》べてしまって、一つもくれないにきまっている。よしよし、ちょうどいい、ねむけざましに｜食《た》べてやれ。」","と、こう｜独《ひと》り｜言《ごと》をいいながら、ふろしき｜包《づつ》みをほどくと、大きなお｜重箱《じゅうばこ》にいっぱい、おいしそうなお｜団子《だんご》がつまっていました。｜小僧《こぞう》はにこにこしながら、お｜団子《だんご》をほおばって、もう一つ、もう一つと、｜食《た》べるうちに、とうとうお｜重箱《じゅうばこ》にいっぱいのお｜団子《だんご》を、きれいに｜食《た》べてしまいました。｜食《た》べてしまって、｜小僧《こぞう》ははじめて｜気《き》がついたように、","「ああ、しまった。｜和尚《おしょう》さんが｜帰《かえ》って｜来《き》たらどうしよう。」","と、｜困《こま》ってべそをかきました。するうち、ふと｜何《なに》か｜思《おも》いついたとみえて、いきなりお｜重箱《じゅうばこ》をかかえて、｜本堂《ほんどう》へ｜駆《か》け｜出《だ》して行きました。そして｜御本尊《ごほんぞん》の｜阿弥陀《あみだ》さまのお口のまわりに、｜重箱《じゅうばこ》のふちにたまったあんこを、｜指《ゆび》でかきよせては、こてこてとぬりつけました。そして｜重箱《じゅうばこ》を｜阿弥陀《あみだ》さまの｜前《まえ》に｜置《お》いて、｜部屋《へや》に｜帰《かえ》って｜来《き》て、｜知《し》らん｜顔《かお》をしてお｜経《きょう》を｜読《よ》んでいました。"],"chars":713,"quiz":{"q":"小僧は、お団子を食べたあと、阿弥陀さまになにをした？","choices":["口のまわりにあんこをぬった","お団子をおそなえした","お経をよんだ"],"why":"阿弥陀さまが食べたように見せるため、口のまわりにあんこをぬりつけました。"}},{"id":"s13p4","paras":["しばらくすると、｜和尚《おしょう》さんは｜帰《かえ》って｜来《き》て、｜小僧《こぞう》に、","「｜留守《るす》にだれも｜来《こ》なかったか。」","とたずねました。","「お｜隣《となり》のおばあさんが、お｜重箱《じゅうばこ》を｜持《も》って｜来《き》ました。おひがんだから｜和尚《おしょう》さんに｜上《あ》げて｜下《くだ》さいといいました。」","と、｜小僧《こぞう》は｜答《こた》えました。","「その｜重箱《じゅうばこ》はどこにある。」","「｜本堂《ほんどう》の｜御本尊《ごほんぞん》さまの｜前《まえ》に｜上《あ》げて｜置《お》きました。」","「うん、それはなかなか｜気《き》が｜利《き》いている。どれ、どれ。」","といいながら、｜和尚《おしょう》さんは｜本堂《ほんどう》へ行ってみますと、なるほど｜重箱《じゅうばこ》がうやうやしく、｜御本尊《ごほんぞん》の｜前《まえ》に｜上《あ》がっていましたが、あけてみると、中はきれいにからになっていました。","「これこれ、｜小僧《こぞう》。きさまが｜食《た》べたのだな。」","と、｜和尚《おしょう》さんは大きな｜声《こえ》でどなりつけました。すると｜小僧《こぞう》はすまして、のこのこやって｜来《き》て、","「へええ、とんでもない、そんなことがあるものですか。」","といいながら、そこらをきょろきょろ｜見《み》まわして、","「ああ、わかりました。｜御本尊《ごほんぞん》の｜金仏《かなぶつ》さまが｜上《あ》がったのです。ほら、あのとおりお口のはたに、あんこがいっぱいついています。」","と、こういうと、｜和尚《おしょう》さんはそれを｜見《み》て、","「なるほどあんこがついている。お｜行儀《ぎょうぎ》のわるい｜金仏《かなぶつ》さまもあればあったものだ。」","といいながら、おこって手に｜持《も》っていた｜払子《ほっす》で、｜金仏《かなぶつ》さまの｜頭《あたま》を一つくらわせました。すると「くわん、くわん。」と｜金仏《かなぶつ》さまは｜鳴《な》りました。"],"chars":537,"quiz":{"q":"和尚さんが金仏さまをたたくと、なんと鳴った？","choices":["くわん、くわん","ごおん","くった、くった"],"why":"金仏さまは「くわん、くわん」（食わん）と鳴りました。"}},{"id":"s13p5","paras":["「なに、くわんことがあるものか。」","と、またおこって二｜度《ど》つづけざまにたたきますと、また「くわん、くわん。」と｜鳴《な》りました。","そこで｜和尚《おしょう》さんは、また｜小僧《こぞう》の｜方《ほう》を｜振《ふ》り｜返《かえ》ってみて、","「それ｜見《み》ろ、｜金仏《かなぶつ》さまはいくらたたいても、くわん、くわんというぞ。やはりきさまが｜食《た》べたにちがいない。」","すると｜小僧《こぞう》は｜困《こま》った｜顔《かお》をして、","「たたいたぐらいでは｜白状《はくじょう》しませんよ。｜釜《かま》うでにしておやんなさい。」","といいました。そこで大きなお｜釜《かま》にいっぱいお｜湯《ゆ》を｜沸《わ》かして、｜金仏《かなぶつ》さまをほうり｜込《こ》みました。すると｜間《ま》もなく、お｜湯《ゆ》がぐらぐらにたぎってきて、","「くった、くった、くった。」","といいました。","「そらごらんなさい、｜和尚《おしょう》さん。とうとう｜白状《はくじょう》しましたよ。」","と、｜小僧《こぞう》さんはとくいらしくいいました。"],"chars":312,"quiz":{"q":"金仏さまが「くった、くった」と言ったのはどんなとき？","choices":["お釜でゆでられたとき","たたかれたとき","お経をきいたとき"],"why":"お釜のお湯がぐらぐらにたぎって「くった、くった」と聞こえました。"}}]},{"id":"s14","title":"手袋を買いに","author":"新美南吉","url":"https://www.aozora.gr.jp/cards/000121/files/637_13341.html","level":3,"blurb":"雪の日、子狐がひとりで町へ手袋を買いにいく。","chars":3515,"parts":[{"id":"s14p1","paras":["寒い冬が北方から、｜狐《きつね》の親子の｜棲《す》んでいる森へもやって来ました。","ある朝｜洞穴《ほらあな》から子供の狐が出ようとしましたが、","「あっ」と叫んで｜眼《め》を｜抑《おさ》えながら母さん狐のところへころげて来ました。","「母ちゃん、眼に何か刺さった、ぬいて｜頂戴《ちょうだい》早く早く」と言いました。","母さん狐がびっくりして、あわてふためきながら、眼を抑えている子供の手を恐る恐るとりのけて見ましたが、何も刺さってはいませんでした。母さん狐は洞穴の入口から外へ出て初めてわけが｜分《わ》かりました。昨夜のうちに、真白な雪がどっさり降ったのです。その雪の上からお｜陽《ひ》さまがキラキラと｜照《て》らしていたので、雪は｜眩《まぶ》しいほど反射していたのです。雪を知らなかった子供の狐は、あまり強い反射をうけたので、眼に何か刺さったと思ったのでした。","子供の狐は遊びに行きました。｜真綿《まわた》のように｜柔《やわ》らかい雪の上を｜駆《か》け｜回《まわ》ると、雪の｜粉《こ》が、しぶきのように飛び散って小さい｜虹《にじ》がすっと映るのでした。","すると突然、うしろで、","「どたどた、ざーっ」と｜物凄《ものすご》い音がして、パン粉のような｜粉雪《こなゆき》が、ふわーっと子狐におっかぶさって来ました。子狐はびっくりして、雪の中にころがるようにして十メートルも向こうへ逃げました。何だろうと思ってふり返って見ましたが何もいませんでした。それは｜樅《もみ》の枝から雪がなだれ落ちたのでした。まだ枝と枝の間から白い絹糸のように雪がこぼれていました。"],"chars":565,"quiz":{"q":"子狐が「目に何かささった」と思ったのはなぜ？","choices":["雪にお日さまがまぶしく反射したから","木の枝が目に入ったから","風が強かったから"],"why":"雪を知らない子狐は、雪の反射のまぶしさを、何かささったと思ったのです。"}},{"id":"s14p2","paras":["間もなく洞穴へ帰って来た子狐は、","「お母ちゃん、お手々が冷たい、お手々がちんちんする」と言って、｜濡《ぬ》れて｜牡丹色《ぼたんいろ》になった両手を母さん狐の前にさしだしました。母さん狐は、その手に、は――っと息をふっかけて、ぬくとい母さんの手でやんわり包んでやりながら、","「もうすぐ｜暖《あたた》かくなるよ、雪をさわると、すぐ暖かくなるもんだよ」といいましたが、かあいい坊やの手に｜霜焼《しもやけ》ができてはかわいそうだから、夜になったら、町まで行って、｜坊《ぼう》やのお手々にあうような毛糸の手袋を買ってやろうと思いました。","暗い暗い夜が｜風呂敷《ふろしき》のような影をひろげて野原や森を包みにやって来ましたが、雪はあまり白いので、包んでも包んでも白く浮かびあがっていました。","親子の銀狐は洞穴から出ました。子供の方はお母さんのお｜腹《なか》の下へはいりこんで、そこからまんまるな眼をぱちぱちさせながら、あっちやこっちを見ながら歩いて行きました。","やがて、｜行《ゆ》く｜手《て》にぽっつりあかりが一つ見え始めました。それを子供の狐が見つけて、","「母ちゃん、お星さまは、あんな低いところにも落ちてるのねえ」とききました。","「あれはお星さまじゃないのよ」と言って、その時母さん狐の足はすくんでしまいました。"],"chars":495,"quiz":{"q":"母さん狐の足がすくんだのはなにを見たとき？","choices":["町の灯","お星さま","人間"],"why":"町の灯を見て、むかし町でこわい目にあったことを思い出しました。"}},{"id":"s14p3","paras":["「あれは町の｜灯《ひ》なんだよ」","その町の灯を見た時、母さん狐は、ある時町へお友達と出かけて行って、とんだめにあったことを｜思《おも》い｜出《だ》しました。およしなさいっていうのもきかないで、お友達の狐が、ある家の｜家鴨《あひる》を盗もうとしたので、お｜百姓《ひゃくしょう》に見つかって、さんざ追いまくられて、命からがら逃げたことでした。","「母ちゃん何してんの、早く行こうよ」と子供の狐がお腹の下から言うのでしたが、母さん狐はどうしても足がすすまないのでした。そこで、しかたがないので、｜坊《ぼう》やだけを一人で町まで行かせることになりました。","「坊やお手々を片方お出し」とお母さん狐がいいました。その手を、母さん狐はしばらく握っている間に、｜可愛《かわい》い人間の子供の手にしてしまいました。坊やの狐はその手をひろげたり握ったり、｜抓《つね》って見たり、｜嗅《か》いで見たりしました。","「何だか変だな母ちゃん、これなあに？」と言って、雪あかりに、またその、人間の手に変えられてしまった自分の手をしげしげと見つめました。","「それは人間の手よ。いいかい坊や、町へ行ったらね、たくさん人間の家があるからね、まず表に｜丸《まる》いシャッポの看板のかかっている家を｜探《さが》すんだよ。それが見つかったらね、トントンと戸を｜叩《たた》いて、今晩はって言うんだよ。そうするとね、中から人間が、すこうし戸をあけるからね、その戸の｜隙間《すきま》から、こっちの手、ほらこの人間の手をさし入れてね、この手にちょうどいい手袋頂戴って言うんだよ、わかったね、決して、こっちのお手々を出しちゃ｜駄目《だめ》よ」と母さん狐は言いきかせました。"],"chars":630,"quiz":{"q":"母さん狐は、子狐の片手をなにに変えた？","choices":["人間の子どもの手","手袋","雪"],"why":"片手をにぎって、人間の子どもの手に変えてしまいました。"}},{"id":"s14p4","paras":["「どうして？」と坊やの狐はききかえしました。","「人間はね、相手が狐だと分かると、手袋を売ってくれないんだよ、それどころか、｜掴《つか》まえて｜檻《おり》の中へ入れちゃうんだよ、人間ってほんとに｜恐《こわ》いものなんだよ」","「ふーん」","「決して、こっちの手を出しちゃいけないよ、こっちの方、ほら人間の手の方をさしだすんだよ」と言って、母さんの狐は、持って来た二つの｜白銅貨《はくどうか》を、人間の手の方へ握らせてやりました。","子供の狐は、町の｜灯《ひ》を目あてに、雪あかりの野原をよちよちやって行きました。初めのうちは一つきりだった灯が二つになり三つになり、はては十にもふえました。狐の子供はそれを見て、灯には、星と同じように、赤いのや黄いのや青いのがあるんだなと思いました。やがて町にはいりましたが通りの家々はもうみんな戸を｜閉《し》めてしまって、高い窓から暖かそうな光が、道の雪の上に落ちているばかりでした。","けれど表の看板の上にはたいてい小さな電灯がともっていましたので、狐の子は、それを見ながら、帽子屋を探して行きました。自転車の看板や、｜眼鏡《めがね》の看板やその他いろんな看板が、あるものは、新しいペンキで｜描《か》かれ、あるものは、古い壁のようにはげていましたが、町に初めて出て来た子狐にはそれらのものがいったい何であるか分からないのでした。","とうとう帽子屋がみつかりました。お母さんが道々よく教えてくれた、黒い大きなシルクハットの帽子の看板が、青い電灯に｜照《て》らされてかかっていました。"],"chars":601,"quiz":{"q":"子狐がさがす帽子屋の看板はどんなもの？","choices":["大きなシルクハット","自転車","めがね"],"why":"黒い大きなシルクハットの看板が、青い電灯に照らされていました。"}},{"id":"s14p5","paras":["子狐は教えられた通り、トントンと戸を叩きました。","「今晩は」","すると、中では何かことこと音がしていましたがやがて、戸が一寸ほどゴロリとあいて、光の帯が道の白い雪の上に長く伸びました。","子狐はその光がまばゆかったので、めんくらって、まちがった方の手を、――お母さまが出しちゃいけないと言ってよく聞かせた方の手をすきまからさしこんでしまいました。","「このお手々にちょうどいい手袋下さい」","すると帽子屋さんは、おやおやと思いました。狐の手です。狐の手が手袋をくれと言うのです。これはきっと｜木《こ》の｜葉《は》で買いに来たんだなと思いました。そこで、","「先にお金を下さい」と言いました。子狐はすなおに、握って来た白銅貨を二つ帽子屋さんに渡しました。帽子屋さんはそれを｜人差指《ひとさしゆび》のさきにのっけて、カチ合わせて見ると、チンチンとよい音がしましたので、これは木の葉じゃない、ほんとのお金だと思いましたので、｜棚《たな》から子供用の毛糸の手袋をとり出して来て子狐の手に持たせてやりました。子狐は、お礼を言ってまた、もと来た道を帰り始めました。","「お母さんは、人間は恐ろしいものだっておっしゃったがちっとも恐ろしくないや。だって僕の手を見てもどうもしなかったもの」と思いました。けれど子狐はいったい人間なんてどんなものか見たいと思いました。"],"chars":540,"quiz":{"q":"子狐は帽子屋に、どちらの手を出してしまった？","choices":["狐の手（まちがったほう）","人間の手","両手"],"why":"光がまぶしくて、出してはいけない狐の手を出してしまいました。"}},{"id":"s14p6","paras":["ある窓の下を通りかかると、人間の声がしていました。何というやさしい、何という美しい、何と言うおっとりした声なんでしょう。","「ねむれ ねむれ","母の胸に、","ねむれ ねむれ","母の手に――」","子狐はその｜唄声《うたごえ》は、きっと人間のお母さんの声にちがいないと思いました。だって、子狐が眠る時にも、やっぱり母さん狐は、あんなやさしい声でゆすぶってくれるからです。","するとこんどは、子供の声がしました。","「母ちゃん、こんな寒い夜は、森の子狐は寒い寒いって｜鳴《な》いてるでしょうね」","すると母さんの声が、","「森の子狐もお母さん狐のお唄をきいて、｜洞穴《ほらあな》の中で眠ろうとしているでしょうね。さあ坊やも早くねんねしなさい。森の子狐と坊やとどっちが早くねんねするか、きっと坊やの方が早くねんねしますよ」","それをきくと子狐は急にお母さんが恋しくなって、お母さん狐の待っている方へ｜跳《と》んで行きました。","お母さん狐は、心配しながら、坊やの狐の帰って来るのを、今か今かとふるえながら待っていましたので、坊やが来ると、｜暖《あたた》かい胸に抱きしめて泣きたいほどよろこびました。","二匹の狐は森の方へ帰って行きました。月が出たので、狐の毛なみが銀色に光り、その足あとには、コバルトの影がたまりました。","「母ちゃん、人間ってちっとも｜恐《こわ》かないや」","「どうして？」","「坊、間違えてほんとうのお手々出しちゃったの。でも帽子屋さん、｜掴《つか》まえやしなかったもの。ちゃんとこんないい暖かい手袋くれたもの」","と言って手袋のはまった両手をパンパンやって見せました。お母さん狐は、","「まあ！」とあきれましたが、「ほんとうに人間はいいものかしら。ほんとうに人間はいいものかしら」とつぶやきました。"],"chars":684,"quiz":{"q":"「人間ってちっともこわくない」と聞いて、母さん狐はなんと言った？","choices":["「ほんとうに人間はいいものかしら」","「よかったね」","「二度と町へ行ってはだめ」"],"why":"母さん狐は「ほんとうに人間はいいものかしら」と二度つぶやきました。"}}]},{"id":"s15","title":"赤ずきんちゃん","author":"グリム兄弟（楠山正雄訳）","url":"https://www.aozora.gr.jp/cards/001091/files/42311_15546.html","level":3,"blurb":"森のおばあさんの家へ。とちゅうで出会ったのは、おおかみ。","chars":3700,"parts":[{"id":"s15p1","paras":["むかし、むかし、あるところに、ちいちゃいかわいい女の子がありました。それはたれだって、ちょいとみただけで、かわいくなるこの子でしたが、でも、たれよりもかれよりも、この子のおばあさんほど、この子をかわいがっているものはなく、この子をみると、なにもかもやりたくてやりたくて、いったいなにをやっていいのかわからなくなるくらいでした。それで、あるとき、おばあさんは、赤いびろうどで、この子にずきんをこしらえてやりました。すると、それがまたこの子によく似あうので、もうほかのものは、なんにもかぶらないと、きめてしまいました。そこで、この子は、赤ずきんちゃん、赤ずきんちゃん、とばかり、よばれるようになりました。","ある日、おかあさんは、この子をよんでいいました。","「さあ、ちょいといらっしゃい、赤ずきんちゃん、ここにお｜菓子《かし》がひとつと、ぶどう｜酒《しゅ》がひとびんあります。これを赤ずきんちゃん、おばあさんのところへもっていらっしゃい。おばあさんは、ご病気でよわっていらっしゃるが、これをあげると、きっと元気になるでしょう。それでは、あつくならないうちにおでかけなさい。それから、そとへでたら気をつけて、おぎょうぎよくしてね、やたらに、しらない横道へかけだしていったりなんかしないのですよ。そんなことをして、ころびでもしたら、せっかくのびんはこわれるし、おばあさんにあげるものがなくなるからね。それから、おばあさんのおへやにはいったら、まず、おはようございます、をいうのをわすれずにね。はいると、いきなり、おへやの中をきょろきょろみまわしたりなんかしないでね。」"],"chars":667,"quiz":{"q":"赤ずきんちゃんがおばあさんにとどけるものは？","choices":["お菓子とぶどう酒","花たば","手袋"],"why":"病気のおばあさんのために、お菓子とぶどう酒をもっていきます。"}},{"id":"s15p2","paras":["「そんなこと、あたし、ちゃんとよくしてみせてよ。」と、赤ずきんちゃんは、おかあさんにそういって、指きりしました。","ところで、おばあさんのおうちは、村から半道はなれた森の中にありました。赤ずきんちゃんが森にはいりかけますと、おおかみがひょっこりでてきました。でも、赤ずきんちゃんは、おおかみって、どんなわるいけだものだかしりませんでしたから、べつだん、こわいともおもいませんでした。","「赤ずきんちゃん、こんちは。」と、おおかみはいいました。","「ありがとう、おおかみちゃん。」","「たいそうはやくから、どちらへ。」","「おばあちゃんのところへいくのよ。」","「前かけの下にもってるものは、なあに。」","「お菓子に、ぶどう酒。おばあさん、ご病気でよわっているでしょう。それでおみまいにもってってあげようとおもって、きのう、おうちで焼いたの。これでおばあさん、しっかりなさるわ。」","「おばあさんのおうちはどこさ、赤ずきんちゃん。」","「これからまた、八、九｜町《ちょう》もあるいてね、森のおくのおくで、大きなかしの木が、三ぼん立っている下のおうちよ。おうちのまわりに、くるみの｜生垣《いけがき》があるから、すぐわかるわ。」"],"chars":480,"quiz":{"q":"おばあさんの家の目じるしは？","choices":["かしの木が三本と、くるみの生垣","赤い屋根","大きな池"],"why":"赤ずきんちゃんは、おおかみに家の場所をくわしく教えてしまいました。"}},{"id":"s15p3","paras":["赤ずきんちゃんは、こうおしえました。","おおかみは、心の中でかんがえていました。","「わかい、やわらかそうな小むすめ、こいつはあぶらがのって、おいしそうだ。ばあさまよりは、ずっとあじがよかろう。ついでにりょうほういっしょに、ぱっくりやるくふうがかんじんだ。」","そこで、おおかみは、しばらくのあいだ、赤ずきんちゃんとならんであるきながら、道みちこう話しました。","「赤ずきんちゃん、まあ、そこらじゅうきれいに咲いている花をごらん。なんだって、ほうぼうながめてみないんだろうな。ほら、小鳥が、あんなにいい声で歌をうたっているのに、赤ずきんちゃん、なんだかまるできいていないようだなあ。学校へいくときのように、むやみと、せっせこ、せっせこと、あるいているんだなあ。そとは、森の中がこんなにあかるくてたのしいのに。」","そういわれて、赤ずきんちゃんは、あおむいてみました。すると、お日さまの光が、木と木の茂った中からもれて、これが、そこでもここでも、たのしそうにダンスしていて、どの木にもどの木にも、きれいな花がいっぱい咲いているのが、目にはいりました。そこで、","「あたし、おばあさまに、げんきでいきおいのいいお花をさがして、花たばをこしらえて、もってってあげようや。するとおばあさん、きっとおよろこびになるわ。まだ朝はやいから、だいじょうぶ、時間までに行かれるでしょう。」","と、こうおもって、ついと横道から、その中へかけだしてはいって、森の中のいろいろの花をさがしました。そうして、ひとつ花をつむと、その先に、もっときれいなのがあるんじゃないか、という気がして、そのほうへかけて行きました。そうして、だんだん森のおくへおくへと、さそわれて行きました。","ところが、このあいだに、すきをねらって、おおかみは、すたこらすたこら、おばあさんのおうちへかけていきました。そして、とんとん、戸をたたきました。"],"chars":783,"quiz":{"q":"おおかみが花をすすめたのはなぜ？","choices":["その間におばあさんの家へ先に行くため","赤ずきんちゃんがすきだから","花がきれいだから"],"why":"赤ずきんちゃんが花をつんでいるすきに、おばあさんの家へ走っていきました。"}},{"id":"s15p4","paras":["「おや、どなた。」","「赤ずきんちゃんよ。お菓子とぶどう酒を、おみまいにもって来たのよ。あけてちょうだい。」","「とっ手をおしておくれ。おばあさんはご病気でよわっていて、おきられないのだよ。」","おおかみは、とっ手をおしました。戸は、ぼんとあきました。おおかみはすぐとはいっていって、なんにもいわずに、いきなりおばあさんのねているところへ行って、あんぐりひと口に、おばあさんをのみこみました。それから、おばあさんの着物を着て、おばあさんのずきんをかぶって、おばあさんのお｜床《とこ》にごろりと寝て、カーテンを引いておきました。","赤ずきんちゃんは、でも、お花をあつめるのにむちゅうで、森じゅうかけまわっていました。そうして、もうあつめるだけあつめて、このうえ持ちきれないほどになったとき、おばあさんのことをおもいだして、またいつもの道にもどりました。おばあさんのうちへ来てみると、戸があいたままになっているので、へんだとおもいながら、中へはいりました。すると、なにかが、いつもとかわってみえたので、","「へんだわ、どうしたのでしょう。きょうはなんだか胸がわくわくして、きみのわるいこと。おばあさんのところへくれば、いつだってたのしいのに。」と、おもいながら、大きな声で、","「おはようございます。」","と、よんでみました。でも、おへんじはありませんでした。"],"chars":559,"quiz":{"q":"戸があいたままで、赤ずきんちゃんはどう思った？","choices":["へんだと思った","うれしかった","おこった"],"why":"「きょうはなんだか胸がわくわくして、きみのわるいこと」と思いました。"}},{"id":"s15p5","paras":["そこで、お｜床《とこ》のところへいって、カーテンをあけてみました。すると、そこにおばあさんは、横になっていましたが、ずきんをすっぽり目までさげて、なんだかいつもとようすがかわっていました。","「あら、おばあさん、なんて大きなお耳。」","「おまえの声が、よくきこえるようにさ。」","「あら、おばあさん、なんて大きなおめめ。」","「おまえのいるのが、よくみえるようにさ。」","「あら、おばあさん、なんて大きなおてて。」","「おまえが、よくつかめるようにさ。」","「でも、おばあさん、まあ、なんてきみのわるい大きなお口だこと。」","「おまえをたべるにいいようにさ。」","こういうがはやいか、おおかみは、いきなり寝床からとびだして、かわいそうに、赤ずきんちゃんを、ただひと口に、あんぐりやってしまいました。","これで、したたかおなかをふくらませると、おおかみはまた寝床にもぐって、ながながと寝そべって休みました。やがて、ものすごい音を立てて、いびきをかきだしました。","ちょうどそのとき、かりうどがおもてを通りかかって、はてなと思って立ちどまりました。","「ばあさんが、すごいいびきで寝ているが、へんだな。どれ、なにかかわったことがあるんじゃないか、みてやらずばなるまい。」"],"chars":504,"quiz":{"q":"「なんて大きなお口」と言うと、おおかみはどうした？","choices":["赤ずきんちゃんをひと口にのみこんだ","にげだした","ねむった"],"why":"おおかみは寝床からとびだして、赤ずきんちゃんをのみこんでしまいました。"}},{"id":"s15p6","paras":["そこで、中へはいってみて、寝床のところへ行ってみますと、おおかみが横になっていました。","「ちきしょう、このばちあたりめが、とうとうみつけたぞ。ながいあいだ、きさまをさがしていたんだ。」","そこで、かりうどは、すぐと鉄砲をむけました。とたんに、ふと、ことによると、おおかみのやつ、おばあさんをそのままのんでいるのかもしれないし、まだなかで、たすかっているのかもしれないぞ、とおもいつきました。そこで鉄砲をうつことはやめにして、そのかわり、はさみをだして、ねむっているおおかみのおなかを、じょきじょき切りはじめました。","ふたはさみいれると、もう赤いずきんがちらと見えました。もうふたはさみいれると、女の子がとびだしてきて、","「まあ、あたし、どんなにびっくりしたでしょう。おおかみのおなかの中の、それはくらいったらなかったわ。」と、いいました。","やがて、おばあさんも、まだ生きていて、はいだしてきました。もう、よわって虫の息になっていました。赤ずきんちゃんは、でも、さっそく、大きなごろた石を、えんやらえんやらはこんできて、おおかみのおなかのなかにいっぱい、つめました。やがて目がさめて、おおかみがとびだそうとしますと、石のおもみでへたばりました。","さあ、三人は大よろこびです。かりうどは、おおかみの毛皮をはいで、うちへもってかえりました。おばあさんは、赤ずきんちゃんのもってきたお菓子をたべて、ぶどう酒をのみました。それで、すっかりげんきをとりかえしました。でも、赤ずきんちゃんは、（もうもう、二どと、森の中で横道にはいって、かけまわったりなんかやめましょう。おかあさんがいけないと、おっしゃったのですものね。）と、かんがえました。"],"chars":707,"quiz":{"q":"かりうどが鉄砲をうたなかったのはなぜ？","choices":["おばあさんがおなかの中にいるかもしれないから","鉄砲がこわれたから","おおかみがかわいそうだから"],"why":"おばあさんがまだ助かるかもしれないと思い、はさみでおなかを切りました。"}}]}];

<script>
(() => {
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const KEY = 'yomista.v1';
const DOW = ['日','月','火','水','木','金','土'];
const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtTime = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const plain = s => s.replace(/｜([^《]+)《[^》]+》/g,'$1');

// ---------- 状態 ----------
const defaults = () => ({
  settings:{level:1, furigana:true, pace:false, paceCpm:0, fontSize:1.4, voice:'', voiceRate:1, voiceSrc:'ai', voiceGap:'normal', listenMode:'cont', listenRepeat:1, rec:true, grade:3},
  sessions:[], bases:[], outs:0, runs:{}, words:[], done:{}, stamps:{}, stampNew:[], recs:[]
});
let S = defaults();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ S = Object.assign(defaults(), JSON.parse(raw)); S.settings=Object.assign(defaults().settings, S.settings||{}); } }catch(e){}
  if(typeof S.bases==='number'){ S.bases=[1,2,3].slice(0, S.bases); }
  S.sessions=S.sessions.map(x=> x.cpm!==undefined ? x : {date:x.date, part:x.part, chars:x.chars, t:x.t1, cpm:x.cpm1, quiz:x.quiz, hit:x.v==='hr'?4:1, bonus:0, scored:0}); }
// ---------- 保存先：この端末（localStorage）＋ クラウド（アーティファクトのdb、プレイヤーごと） ----------
const PKEY='yomista.player';            // この端末で最後に選んだプレイヤー {id,name}
let P=null, LASTP=null;                  // 現在のプレイヤー / この端末で前回使ったプレイヤー
let DB=null, dbState='unknown';          // 'unknown' | 'ready' | 'none'
let localPlayers=[];                     // dbが使えない端末用の一覧
function localKey(){ return P ? `${KEY}.${P.id}` : KEY; }
function loadPlayerLocal(){ S=defaults(); try{ const raw=localStorage.getItem(localKey()); if(raw){ S=Object.assign(defaults(), JSON.parse(raw)); S.settings=Object.assign(defaults().settings, S.settings||{}); } }catch(e){} migrate(); }
function migrate(){ try{ S=JSON.parse(JSON.stringify(S)); }catch(e){} if(typeof S.bases==='number'){ S.bases=[1,2,3].slice(0, S.bases); }
  if(!Array.isArray(S.bases)) S.bases=[]; if(!Array.isArray(S.sessions)) S.sessions=[]; if(!S.runs||typeof S.runs!=='object') S.runs={}; if(!S.done||typeof S.done!=='object') S.done={}; if(!S.stamps||typeof S.stamps!=='object') S.stamps={}; if(!Array.isArray(S.stampNew)) S.stampNew=[]; if(!Array.isArray(S.words)) S.words=[]; if(!Array.isArray(S.recs)) S.recs=[];
  S.sessions=S.sessions.map(x=> x.cpm!==undefined ? x : {date:x.date, part:x.part, chars:x.chars, t:x.t1, cpm:x.cpm1, quiz:x.quiz, hit:x.v==='hr'?4:1, bonus:0, scored:0}); }
let writing=false, dirty=false;
async function flushCloud(){ if(!DB||!P||writing) return; writing=true; dirty=false;
  try{ const body={name:P.name, updated:new Date().toISOString(), state:JSON.parse(JSON.stringify(S))}; await DB.doc('players/'+P.id).set(body); syncMark('ok'); }
  catch(e){ syncMark('err'); }
  writing=false; if(dirty) flushCloud(); }
let flushTimer=null;
function save(){ try{ localStorage.setItem(localKey(), JSON.stringify(S)); }catch(e){}
  if(DB&&P){ dirty=true; syncMark('pending'); clearTimeout(flushTimer); flushTimer=setTimeout(flushCloud, 800); } }
function syncMark(st){ const el=$('#sync'); if(!el) return; el.dataset.st=st; el.textContent = st==='ok'?'☁ 保存ずみ': st==='pending'?'☁ 保存中…': st==='err'?'☁ 保存できず':'この端末のみ'; }
async function initCloud(){
  refreshEnv();
  let db=null; try{ if(window.claude && window.claude.use) db = await window.claude.use('db'); }catch(e){ db=null; }
  DB=db; dbState = db ? 'ready' : 'none';
  syncMark(db?'ok':'none');
  watchStories();
  showPlayerPicker();
}
async function loadPlayerCloud(){ if(!DB||!P) return;
  try{ const snap=await DB.doc('players/'+P.id).get();
    if(snap.exists){ const d=JSON.parse(JSON.stringify(snap.data()||{})); const cloud=Object.assign(defaults(), d.state||{}); cloud.settings=Object.assign(defaults().settings, cloud.settings||{});
      // クラウドとこの端末の両方に記録があれば、多いほう（通常はクラウド）を採用し、足りない分を合流
      const seen=new Set(cloud.sessions.map(x=>x.date+'|'+x.part+'|'+x.t)); let merged=false;
      for(const x of S.sessions){ const k=x.date+'|'+x.part+'|'+x.t; if(!seen.has(k)){ cloud.sessions.push(x); cloud.done[x.part]=true; merged=true; } }
      if(merged) cloud.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
      if(!Array.isArray(cloud.recs)) cloud.recs=[]; const seenR=new Set(cloud.recs.map(x=>x.at));
      for(const x of (S.recs||[])){ if(x && !seenR.has(x.at)){ cloud.recs.push(x); merged=true; } }
      cloud.recs.sort((a,b)=>a.at-b.at); if(cloud.recs.length>300) cloud.recs=cloud.recs.slice(-300);
      S=cloud; migrate(); try{ localStorage.setItem(localKey(), JSON.stringify(S)); }catch(e){}
      if(merged) flushCloud(); else syncMark('ok');
    } else { flushCloud(); }
  }catch(e){ syncMark('err'); }
}

// ---------- おはなし（付属 ＋ おうちの人が追加） ----------
// 付属は BUILTIN_STORIES。追加したおはなしはクラウド（db の stories/）とこの端末に保存し、ここで1つの本だなにまとめる。
const USKEY='yomista.stories';
function validStory(st){ return !!st && typeof st.id==='string' && /^u[0-9a-z]+$/.test(st.id) && typeof st.title==='string' && Array.isArray(st.parts) && st.parts.length>0 && st.parts.every(p=>p && typeof p.id==='string' && Array.isArray(p.paras) && p.paras.length>0); }
let userStories=[];
try{ const raw=JSON.parse(localStorage.getItem(USKEY)||'[]'); if(Array.isArray(raw)) userStories=raw.filter(validStory); }catch(e){ userStories=[]; }
function cacheUserStories(){ try{ localStorage.setItem(USKEY, JSON.stringify(userStories)); }catch(e){} }
let STORIES=[], allParts=[], PART_MAP=new Map();
function rebuildIndex(){
  const added=userStories.slice().sort((a,b)=>(a.added||'')<(b.added||'')?-1:(a.added||'')>(b.added||'')?1:0);
  STORIES = BUILTIN_STORIES.concat(added);
  allParts = STORIES.flatMap(st => st.parts.map((p,i)=>({...p, story:st, idx:i})));
  PART_MAP = new Map(allParts.map(p=>[p.id,p]));
  buildStamps();
}
const partsOf = st => st.parts;
const partById = id => PART_MAP.get(id);
const isUserStory = st => !!st && st.src==='user';
const isRecent = (iso, days) => { const t=Date.parse(iso||''); return !isNaN(t) && Date.now()-t < days*86400000; };
const cpm = (chars, sec) => sec>0 ? Math.round(chars/(sec/60)) : 0;
const bestCpm = () => S.sessions.reduce((m,x)=>Math.max(m, x.cpm||0), 0);
const avgCpm = () => S.sessions.length? Math.round(S.sessions.reduce((a,x)=>a+x.cpm,0)/S.sessions.length) : 0;
const HITNAME = {0:'アウト',1:'ヒット',2:'ツーベース',3:'スリーベース',4:'ホームラン'};
const storyProgress = st => { const n = st.parts.filter(p=>S.done[p.id]).length; return {n, total:st.parts.length}; };
const weekRuns = () => { // 月曜はじまり
  const d = new Date(); const dow=(d.getDay()+6)%7; const out=[];
  for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()-dow+i); const k=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; out.push({k, dow:x.getDay(), runs:S.runs[k]||0, reads:S.sessions.filter(s=>s.date===k).length, today:k===todayKey()}); }
  return out;
};

// 今日の3話: 進行中 → 当レベル未読 → 隣接レベル。日付でシャッフルを固定
function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
function todaysPicks(){
  const rnd = seeded(todayKey()); const picks=[]; const used=new Set();
  const lv = S.settings.level;
  const inProg = STORIES.filter(st=>{const p=storyProgress(st); return p.n>0 && p.n<p.total;});
  for(const st of inProg){ const next=st.parts.find(p=>!S.done[p.id]); if(next && picks.length<3){ picks.push({part:partById(next.id), story:st, cont:true}); used.add(st.id);} }
  // おうちの人が2週間以内に追加して、まだ読んでいないおはなしを先に（最大2話）
  const fresh = STORIES.filter(st=>isUserStory(st) && !used.has(st.id) && storyProgress(st).n===0 && isRecent(st.added,14)).sort((a,b)=>(b.added||'')<(a.added||'')?-1:1);
  for(const st of fresh.slice(0,2)){ if(picks.length>=3) break; picks.push({part:partById(st.parts[0].id), story:st, cont:false, fresh:true}); used.add(st.id); }
  const order=[lv, lv+1, lv-1, lv+2, lv-2, lv+3, lv-3, lv+4, lv-4].filter(l=>l>=1&&l<=5);
  for(const l of order){
    const cands = STORIES.filter(st=>st.level===l && !used.has(st.id) && storyProgress(st).n===0).sort(()=>rnd()-0.5);
    for(const st of cands){ if(picks.length>=3) break; picks.push({part:partById(st.parts[0].id), story:st, cont:false}); used.add(st.id); }
  }
  if(picks.length<3){ // 全部読破したら、再読
    const cands = STORIES.filter(st=>!used.has(st.id)).sort(()=>rnd()-0.5);
    for(const st of cands){ if(picks.length>=3) break; picks.push({part:partById(st.parts[0].id), story:st, cont:false, again:true}); }
  }
  return picks;
}

// ---------- おてほん（読み上げ） ----------
// シャドーイング練習アプリの再生エンジンを、日本語・小学生向けに移しかえたもの。
//  ・付属のおはなし：事前に作ったAI音声（VOICEVOX 読み聞かせ）を、文ごとのタイムライン（話しはじめ・話しおわり・「、」の間）で動かす
//  ・追加したおはなし／「端末の声」：端末の音声合成で1文ずつ読む。読みはふりがな（ルビ）を使うので漢字を読みまちがえない
//  ・どちらも：速さ（字/分でも表示）、まえ・つぎの文、くりかえし、1文ずつ、まねっこ（追い読み）、読んでいる文節に色をつける
const TTS = ('speechSynthesis' in window) ? window.speechSynthesis : null;
const BASE_CPM = 265;     // AI音声を1.0倍で流したときの平均（字/分）。「ふつう」の基準
const TARGET_MPS = 5.9;   // 同じく1秒あたりの拍（モーラ）。端末の声もこの速さに合わせて読む
function jaVoices(){ if(!TTS) return []; try{ return TTS.getVoices().filter(v=>/^ja/i.test(v.lang)); }catch(e){ return []; } }
function voiceScore(v){ const n=v.name||''; let s=0;
  if(/premium|enhanced|natural|neural|online|拡張|高品質/i.test(n)) s+=50;          // 高品質版の声を最優先
  const pref=['O-ren','Kyoko','Nanami','Google 日本語','Ayumi','Haruka','Hattori','Otoya','Keita','Ichiro'];
  const i=pref.findIndex(p=>n.includes(p)); if(i>=0) s+=30-i;
  if(v.localService) s+=2;                                                            // 通信が切れても止まらない
  return s; }
function pickVoice(){ const vs=jaVoices(); if(!vs.length) return null; const want=S.settings.voice; const hit=want && vs.find(v=>v.name===want); if(hit) return hit;
  return vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]; }
const shortVoice = v => String(v&&v.name||'').replace(/^(Microsoft|Google|Apple)\s+/,'').replace(/\s*[(（].*$/,'').replace(/\s*-\s*Japanese.*$/i,'');
function inputFocused(){ const a=document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
if(TTS && 'onvoiceschanged' in TTS) TTS.addEventListener('voiceschanged',()=>{ if(tab==='parent' && !R && !inputFocused()) renderParent(); });
const speedCpm = v => Math.round(v*BASE_CPM/5)*5;

// 文を分ける（ルビ表記のまま）。「一」「二」だけの行は章の見出し
function sentencesOf(paras){
  const out=[];
  paras.forEach((para,pi)=>{
    const pl=plain(para).trim(); const chap = pl.length<=2 && [...pl].every(c=>'一二三四五六七八九十'.includes(c));
    if(chap){ out.push({pi, raw:para, chap:true}); return; }
    const pieces = (para.match(/[^。！？]*[。！？]+[」）]*|[^。！？]+$/g) || [para]).filter(s=>s.trim());
    pieces.forEach(s=>out.push({pi, raw:s}));
  });
  return out;
}

// ===== 1文を「単位」に分ける：表示する字・読み上げる音・拍の重さ =====
const KANJI_RE=/[㐀-鿿豈-﫿々〆ヶ〇]/, KANA_RE=/[ぁ-ゖゝゞァ-ヺー-ヾ]/;
const SMALL_KANA='ぁぃぅぇぉゃゅょゎァィゥェォャュョヮ';
function moraOf(s){ let m=0; for(const c of String(s)){ if(SMALL_KANA.includes(c)) continue; if(KANA_RE.test(c)) m+=1; else if(KANJI_RE.test(c)) m+=1.8; else if(/[0-9A-Za-z０-９Ａ-Ｚａ-ｚ]/.test(c)) m+=1.2; } return m; }
const OPEN_BR='「『（(〈【［', CLOSE_BR='」』）)〉】］', END_P='。．！？!?', DASH='―—─';
function unitsOf(raw){
  const out=[]; const re=/｜([^《｜]+)《([^》]+)》/g; let m, last=0;
  const text=t=>{ const cs=[...t];
    for(let i=0;i<cs.length;i++){ const c=cs[i];
      if(DASH.includes(c)){ // ダッシュ：かなにはさまれていれば「ー」（は――っと → はーっと）。それ以外は読まない
        let j=i; while(j<cs.length && DASH.includes(cs[j])) j++;
        const prev = i>0 ? cs[i-1] : (out.length ? out[out.length-1].d.slice(-1) : ''), next = cs[j]||'';
        const long = KANA_RE.test(prev) && KANA_RE.test(next);
        for(let k=i;k<j;k++) out.push({d:cs[k], sp:long?'ー':'', w:long?1:0});
        i=j-1; continue; }
      if('、，,'.includes(c)) out.push({d:c, sp:'、', w:0, mark:true});
      else if(END_P.includes(c)) out.push({d:c, sp:c, w:0, end:true});
      else if(OPEN_BR.includes(c)) out.push({d:c, sp:'', w:0, open:true});
      else if(CLOSE_BR.includes(c)) out.push({d:c, sp:'', w:0, close:true});
      else if(c===' '||c==='　') out.push({d:c, sp:'', w:0, space:true});
      else if('…‥'.includes(c)) out.push({d:c, sp:(i>0 && '…‥'.includes(cs[i-1]))?'':'、', w:0});
      else out.push({d:c, sp:c, w:moraOf(c)});
    } };
  while((m=re.exec(raw))){ text(raw.slice(last,m.index)); out.push({d:m[1], rt:m[2], sp:m[2], w:moraOf(m[2])||1}); last=m.index+m[0].length; }
  text(raw.slice(last));
  return out;
}

// ===== 文節のかたまりに分ける（BudouX → Intl.Segmenter → 字の種類 の順に使えるもので） =====
let BX=null;
function budoux(){ if(BX) return BX; try{ if(window.customElements && customElements.get('budoux-ja')){ const p=document.createElement('budoux-ja').parser; if(p && typeof p.parseBoundaries==='function') BX=p; } }catch(e){} return BX; }
const JSEG=(()=>{ try{ return new Intl.Segmenter('ja',{granularity:'word'}); }catch(e){ return null; } })();
const JOINERS=new Set('は が を に へ と で も の や か ね よ な ぞ わ さ て た だ ば し ん っ から まで より ので のに けど けれど けれども ながら ても でも ては には では とは への での との だけ ほど など くらい ぐらい しか こそ さえ です でし ます まし ませ ましょ ない なかっ なく たい たく たら たり だっ だろ でしょ う よう そう らしい れる られる せる させる いる いた いて いま ある あっ あり った って'.split(' '));
function chunksOf(units){
  const n=units.length; if(!n) return [];
  const st=new Array(n).fill(false); const text=units.map(u=>u.d).join(''); const c2u=[], at=new Set(); let pos=0;
  units.forEach((u,i)=>{ at.add(pos); for(let k=0;k<u.d.length;k++) c2u.push(i); pos+=u.d.length; });
  const cut=ci=>{ if(ci>0 && ci<text.length && at.has(ci)) st[c2u[ci]]=true; };
  const bx=budoux();
  if(bx){ try{ bx.parseBoundaries(text).forEach(cut); }catch(e){} }
  else if(JSEG){ try{ for(const sg of JSEG.segment(text)){ const w=sg.segment; if(!sg.isWordLike) continue; if(/^[ぁ-ゟ]+$/.test(w) && (JOINERS.has(w) || w.length<=1)) continue; cut(sg.index); } }catch(e){} }
  else { for(let i=1;i<n;i++){ const a=units[i-1].d.slice(-1), b=units[i].d[0]; if((KANJI_RE.test(b)||/[ァ-ヺ]/.test(b)) && /[ぁ-ゟ]/.test(a)) st[i]=true; } }
  for(let i=1;i<n;i++){ const u=units[i], p=units[i-1];
    if(p.space && !u.space) st[i]=true;                       // わかち書きの空白のあとで区切る
    if(p.mark || p.end) st[i]=true;                           // 「、」「。」のあとで区切る
    if(u.open) st[i]=true;                                    // 「 から新しいかたまり
    if(p.open) st[i]=false;                                   // 「 のすぐあとの字は 「 といっしょ
    if(u.mark||u.end||u.close||u.space||(u.w===0 && !u.open && !u.rt && !KANA_RE.test(u.d) && !KANJI_RE.test(u.d))) st[i]=false;   // 記号は前のかたまりに
  }
  st[0]=true; const out=[];
  st.forEach((b,i)=>{ if(b) out.push([i,i+1]); else out[out.length-1][1]=i+1; });
  return out;
}
function listenModel(part){
  const all=sentencesOf(part.paras), sents=[];
  all.forEach(s=>{ if(s.chap) return; const units=unitsOf(s.raw); sents.push({units, chunks:chunksOf(units), w:units.reduce((a,u)=>a+u.w,0)}); });
  return {all, sents};
}
function listenTextHTML(model, ruby, blind){
  let html='', cur=-1, k=0;
  model.all.forEach(s=>{
    if(s.pi!==cur){ if(cur>=0) html+='</p>'; html+=`<p class="${s.chap?'chapter':''}">`; cur=s.pi; }
    if(s.chap){ html+=rubyHTML(s.raw); return; }
    const sm=model.sents[k];
    html+=`<span class="sn" data-s="${k}">${sm.chunks.map(([a,b],j)=>`<span class="ck" data-c="${j}">${sm.units.slice(a,b).map(u=>u.rt?`<ruby>${esc(u.d)}<rt>${esc(u.rt)}</rt></ruby>`:esc(u.d)).join('')}</span>`).join('')}</span>`;
    k++;
  });
  if(cur>=0) html+='</p>';
  return `<div class="text listen ${ruby?'':'noruby'} ${blind?'blind':''}" id="text">${html}</div>`;
}
const chunkOfUnit = (sm, ui) => { const cs=sm.chunks; for(let j=0;j<cs.length;j++) if(ui<cs[j][1]) return j; return cs.length-1; };

// ===== AI音声：文の中の時間 → 文節 =====
// 話しはじめ〜話しおわりを「、」の間（音声から検出ずみ）で区切り、その中を拍の重さで割りふる
function audioFor(p){
  const a=AUDIO[p.id]; if(a && Array.isArray(a.seg)) return {src:'audio/'+p.id+'.mp3', starts:a.starts, seg:a.seg, dur:a.dur, voice:a.voice||'AI音声'};
  const u=p.audio; if(u && typeof u.src==='string' && Array.isArray(u.starts) && Array.isArray(u.seg)) return {src:u.src, starts:u.starts, seg:u.seg, dur:u.dur, voice:u.voice||'AI音声'};
  return null;
}
function chunkTimes(sm, seg){
  const on=+seg[0], end=+seg[1], pz=seg[2]||[]; const U=sm.units, n=U.length; const ut=new Array(n).fill(on);
  let lastW=-1; U.forEach((u,i)=>{ if(u.w>0) lastW=i; });
  const marks=[]; U.forEach((u,i)=>{ if(u.mark && i<lastW) marks.push(i); });
  const PAUSE_W=3.5, spans=[]; let a=0, t0=on, extra=[];
  marks.forEach((mi,j)=>{ const q=pz[j]; if(Array.isArray(q) && q.length===2){ spans.push({a, b:mi+1, t0, t1:+q[0], extra}); a=mi+1; t0=+q[1]; extra=[]; } else extra.push(mi); });
  spans.push({a, b:n, t0, t1:Math.max(t0+0.05,end), extra});
  spans.forEach(sp=>{ const wt=i=>U[i].w+(sp.extra.includes(i)?PAUSE_W:0); let W=0; for(let i=sp.a;i<sp.b;i++) W+=wt(i); W=W||1; let acc=0;
    for(let i=sp.a;i<sp.b;i++){ ut[i]=sp.t0+(acc/W)*(sp.t1-sp.t0); acc+=wt(i); } });
  return sm.chunks.map(([a,b])=>{ for(let i=a;i<b;i++) if(U[i].w>0) return ut[i]; return ut[a]; });
}

// ===== 端末の声：1文 → 読み上げのまとまり =====
// 長い文（約45拍より長い）は「、」で分ける（Chromeの長文停止を防ぐ）。「ゆったり」では「、」ごとに少し止まる
function utterancesOf(sm, slow){
  const U=sm.units, wOf=([a,b])=>{ let w=0; for(let i=a;i<b;i++) w+=U[i].w; return w; };
  let groups=[], a=0;
  if(slow || sm.w>45){ U.forEach((u,i)=>{ if(u.mark){ groups.push([a,i+1]); a=i+1; } }); }
  groups.push([a,U.length]);
  if(!slow){ const merged=[]; groups.forEach(g=>{ const l=merged[merged.length-1]; if(l && wOf(l)+wOf(g)<=30) l[1]=g[1]; else merged.push(g.slice()); }); groups=merged; }
  return groups.map(([a,b])=>{ let text='', map=[]; for(let i=a;i<b;i++){ const t=U[i].sp; for(let k=0;k<t.length;k++) map.push(i); text+=t; }
      let c=0; while(c<text.length && /[、\s]/.test(text[c])) c++; return {a, b, text:text.slice(c), map:map.slice(c), w:wOf([a,b])}; })
    .filter(x=>x.w>0);
}
// 声ごとの「速さ1あたり何拍/秒で読むか」を、実際に読んだ時間から学習してAI音声の速さに合わせる
const CAL={ key:'yomista.ttscal',
  get(name){ try{ const m=JSON.parse(localStorage.getItem(this.key)||'{}'); const v=+m[name||'_']; return v>2&&v<20?v:8.6; }catch(e){ return 8.6; } },
  put(name, v){ if(!(v>2&&v<20)) return; try{ const m=JSON.parse(localStorage.getItem(this.key)||'{}'); const k=name||'_', o=+m[k]; m[k]=(o>2&&o<20)?o*0.7+v*0.3:v; localStorage.setItem(this.key, JSON.stringify(m)); }catch(e){} } };
const ttsRate = (speed, voice) => Math.min(2, Math.max(0.35, speed*TARGET_MPS/CAL.get(voice&&voice.name)));

// ===== 再生のしくみ（シャドーイングのプレイヤーと同じ流れ） =====
let LP=null;
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function voiceStop(){ if(LP){ lpStopAudio(); if(LP.au){ try{ LP.au.pause(); LP.au.removeAttribute('src'); LP.au.load(); }catch(e){} } LP=null; }

  if(LP.waiting){ LP.waiting=false; const w=document.getElementById('lp-wait'); if(w) w.hidden=true; }

function lpMark(k, c){ if(!LP) return;

function lpAfter(sec, my, fn){ clearTimeout(LP.timer); LP.timer=setTimeout(()=>{ if(LP && my===LP.seq) fn(); }, Math.max(0,sec*1000)); }

function lpReplay(k, my){ if(!LP||my!==LP.seq) return; LP.idx=k; LP.sentFinished=false; if(LP.engine==='file') fileSentence(k,my); else ttsSentence(k,my); }
// 1文読みおわったとき：つづけて／1文ずつ／まねっこ で次の動きを決める
function lpSentDone(k, my, dur){
  if(!LP||my!==LP.seq) return;
  const st=S.settings, mode=st.listenMode, reps=st.listenRepeat, slow=st.voiceGap==='slow';
  if(LP.once && mode==='cont'){ LP.once=false; LP.rep=0; LP.playing=false; LP.sentFinished=true; lpPlayBtn(); lpStatus('▶ でもう一度。「もどる」で音読カードへ'); return; }
  LP.lastDur = dur>0.3 ? dur : (LP.lastDur||3);
  if(mode==='cont'){
    if(k+1<LP.N){ const gap = LP.engine==='file' ? 0.7 : (slow?1.1:0.45); lpAfter(gap, my, ()=>lpReplay(k+1,my)); }
    else lpPartDone(my);
    return; }
  const more = reps===0 || LP.rep+1<reps;
  if(mode==='sent'){
    if(more){ LP.rep++; lpStatus(`もう一回（${LP.rep+1}回め）`); lpAfter(0.8, my, ()=>lpReplay(k,my)); return; }

}
function lpPartDone(my){ if(!LP||my!==LP.seq) return; const st=S.settings;
  if(st.listenMode==='cont'){ LP.rep++; if(st.listenRepeat===0 || LP.rep<st.listenRepeat){ lpStatus(`もう一回（${LP.rep+1}回め）`); lpAfter(1.4, my, ()=>lpReplay(0,my)); return; } }

// --- AI音声（ファイル）
function fileSentence(k, my){
  const A=LP.A, au=LP.au; LP.fileK=k; LP.fileDone=false; LP.pendingNext=null; LP.chunkT=chunkTimes(LP.model.sents[k], A.seg[k]);
  au.playbackRate=S.settings.voiceRate||1;
  // iPhone では「おした瞬間」に play() しないと音が出ないので、読みこみ前でも先に位置を決めて再生する
  const target=Math.max(0, A.starts[k], A.seg[k][0]-0.15);
  try{ au.currentTime=target; }catch(e){}
  if(au.readyState<1){ const fix=()=>{ au.removeEventListener('loadedmetadata',fix); if(LP&&my===LP.seq&&Math.abs(au.currentTime-target)>0.3){ try{ au.currentTime=target; }catch(e){} } }; au.addEventListener('loadedmetadata',fix); }
  const pr=au.play(); if(pr&&pr.catch) pr.catch(()=>{ if(LP&&my===LP.seq){ LP.playing=false; lpPlayBtn(); lpStatus('再生できませんでした。もう一度 ▶ をおしてね'); } });
  lpMark(k,-1);
  const tick=()=>{ if(!LP||my!==LP.seq) return;
    const t=au.currentTime, kk=LP.fileK, sg=A.seg[kk];
    if(LP.pendingNext!=null && t>=A.starts[LP.pendingNext]-0.02){ const nk=LP.pendingNext; LP.pendingNext=null; LP.fileK=nk; LP.idx=nk; LP.fileDone=false; LP.chunkT=chunkTimes(LP.model.sents[nk], A.seg[nk]); LP.raf=requestAnimationFrame(tick); return; }
    if(!LP.fileDone){ const ct=LP.chunkT; let c=-1; for(let j=0;j<ct.length;j++){ if(t+0.04>=ct[j]) c=j; else break; } lpMark(kk,c); }
    if(!LP.fileDone && (t>=sg[1]-0.02 || au.ended)){
      LP.fileDone=true; lpMark(kk, LP.chunkT.length);
      const st=S.settings;
      if(st.listenMode==='cont' && st.voiceGap!=='slow' && kk+1<LP.N && !au.ended){ LP.pendingNext=kk+1; }   // そのまま次の文へ流す
      else { au.pause(); lpSentDone(kk, my, (sg[1]-sg[0])/(au.playbackRate||1)); return; }

// --- 端末の声（音声合成）
function ttsSentence(k, my){
  const sm=LP.model.sents[k], slow=S.settings.voiceGap==='slow';
  if(!sm._utts || sm._slow!==slow){ sm._utts=utterancesOf(sm, slow); sm._slow=slow; }
  const utts=sm._utts, voice=pickVoice(), rate=ttsRate(S.settings.voiceRate||1, voice), t0=performance.now();
  LP.idx=k; lpMark(k,-1);
  const speakU=ui=>{ if(!LP||my!==LP.seq) return;
    if(ui>=utts.length){ lpMark(k, sm.chunks.length); lpSentDone(k, my, (performance.now()-t0)/1000); return; }
    const U=utts[ui], u=new SpeechSynthesisUtterance(U.text); u.lang='ja-JP'; if(voice) u.voice=voice; u.rate=rate; u.pitch=1;
    const spokeAt=performance.now(); let started=0, ended=false, bnd=false;
    const finish=()=>{ if(ended) return; ended=true; clearTimeout(LP&&LP.wd); if(!LP||my!==LP.seq) return; cancelAnimationFrame(LP.raf);
      const d=(performance.now()-(started||spokeAt))/1000; if(started && d>0.5 && U.w>=3) CAL.put(voice&&voice.name, (U.w/d)/rate);
      if(ui+1<utts.length) lpAfter(slow?0.3:0.04, my, ()=>speakU(ui+1)); else speakU(ui+1); };
    u.onstart=()=>{ started=performance.now(); };
    u.onboundary=ev=>{ if(!LP||my!==LP.seq||ended) return; if(ev.name && ev.name!=='word') return; bnd=true; const unit=U.map[Math.min(U.map.length-1, Math.max(0, ev.charIndex|0))]; if(unit!=null) lpMark(k, chunkOfUnit(sm, unit)); };
    u.onend=finish;
    u.onerror=e=>{ if(e && (e.error==='interrupted'||e.error==='canceled')) return; finish(); };
    LP.utt=u; TTS.speak(u);
    const mps=CAL.get(voice&&voice.name)*rate;
    clearTimeout(LP.wd); LP.wd=setTimeout(()=>{ if(!ended){ try{ TTS.cancel(); }catch(_){} finish(); } }, (U.w/Math.max(1,mps)*2.2+4)*1000);   // 終わりの合図が来ない端末の保険
    const tick=()=>{ if(!LP||my!==LP.seq||ended) return;
      if(!bnd){ const el=Math.max(0,(performance.now()-(started||spokeAt+150))/1000); const pos=el*mps; let acc=0, unit=U.a; for(let i=U.a;i<U.b;i++){ unit=i; acc+=sm.units[i].w; if(acc>pos) break; } lpMark(k, chunkOfUnit(sm, unit)); }
      LP.raf=requestAnimationFrame(tick); };
    cancelAnimationFrame(LP.raf); LP.raf=requestAnimationFrame(tick); };
  if(!utts.length){ lpSentDone(k, my, 0.5); return; }
  speakU(0);
}

  for(let i=0;i<pcm.length;i+=step) arr[k++]=Math.abs(pcm[i]); if(!k) return pcm; arr.sort(); const level=arr[Math.min(k-1,Math.floor(k*0.999))];

  for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,pcm[i])); v.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true); }
  let bin=''; const u8=new Uint8Array(bytes); for(let i=0;i<u8.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(bin); }
// 声の高さ（YIN の考え方）。子どもの声が入るよう 90〜600Hz。長い録音は 1500 コマまでに間引く
function pitchHz(pcm, sr){ const frame=Math.round(sr*0.04), minLag=Math.floor(sr/600), maxLag=Math.ceil(sr/90), out=[], d=new Float32Array(maxLag+1);
